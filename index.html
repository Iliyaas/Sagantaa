<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart School Timetable Generator</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg: #0f1420; --bg2: #161d2d; --card: #1b2434; --line: #2a3548;
--txt: #e8eefc; --mut: #93a1bb; --acc: #3d8bfd; --acc2: #1f6feb;
--ok: #2ecc8f; --warn: #f0a92b; --bad: #ff5c6c;}
*{box-sizing: border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin: 0; padding: 0; height: 100%;}
body{background: #0f1420; color: var(--txt); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.45; overflow-x: hidden;}
#app{display: flex; min-height: 100vh;}
#side{width: 234px; flex: 0 0 234px; background: var(--bg2); border-right: 1px solid var(--line); padding: 16px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto;}
.brand{display: flex; align-items: center; gap: 10px; padding: 6px 8px 16px 8px;}
.logo{width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, #3d8bfd, #7b5cff); display: flex; align-items: center; justify-content: center; font-size: 19px; flex: 0 0 38px;}
.brand b{display: block; font-size: 14px;}
.brand small{display: block; color: var(--mut); font-size: 11px;}
.navi{display: flex; flex-direction: column; gap: 3px;}
.navi a{display: flex; align-items: center; gap: 10px; padding: 10px 11px; border-radius: 10px; color: var(--mut); text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer;}
.navi a:hover{background: #202a3d; color: var(--txt);}
.navi a.on{background: linear-gradient(90deg, #22406e, #1d3054); color: #fff; box-shadow: inset 0 0 0 1px #2f5590;}
.navi a .badge{margin-left: auto; background: var(--bad); color: #fff; font-size: 11px; padding: 1px 7px; border-radius: 20px; font-weight: 700;}
#main{flex: 1; min-width: 0; padding: 18px 22px 90px 22px;}
.topline{display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px;}
.topline h1{font-size: 20px; margin: 0; font-weight: 650;}
.topline .sub{color: var(--mut); font-size: 13px;}
.spacer{flex: 1;}
.card{background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px;}
.card h2{font-size: 15px; margin: 0 0 12px 0; font-weight: 650;}
.card h2 span{color: var(--mut); font-weight: 400; font-size: 12px; margin-left: 6px;}
.kpis{display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; margin-bottom: 16px;}
.kpi{background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px;}
.kpi .v{font-size: 25px; font-weight: 700;}
.kpi .l{color: var(--mut); font-size: 12px; margin-top: 2px;}
.kpi.bad .v{color: var(--bad);} .kpi.ok .v{color: var(--ok);}
button{font-family: inherit; font-size: 14px; font-weight: 600; padding: 9px 15px; border-radius: 10px; border: 1px solid var(--line); background: #243149; color: var(--txt); cursor: pointer; display: inline-flex; align-items: center; gap: 7px;}
button:hover{background: #2c3b58;}
button.primary{background: linear-gradient(135deg, #3d8bfd, #2f6fe0); border-color: #3d8bfd; color: #fff;}
button.ghost{background: transparent;}
button.bad{background: #3a2028; border-color: #5c2b36; color: #ff8b96;}
button.sm{padding: 5px 10px; font-size: 12.5px; border-radius: 8px;}
button:disabled{opacity: .5; cursor: not-allowed;}
input,select,textarea{font-family: inherit; font-size: 14px; background: #131a29; color: var(--txt); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; outline: none;}
input:focus,select:focus,textarea:focus{border-color: var(--acc);}
label.f{display: block; margin-bottom: 11px;}
label.f>span{display: block; font-size: 12px; color: var(--mut); margin-bottom: 5px; font-weight: 600;}
.row{display: grid; grid-template-columns: 1fr 1fr; gap: 12px;}
.row3{display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;}
table{width: 100%; border-collapse: collapse; font-size: 13.5px;}
th{text-align: left; color: var(--mut); font-size: 11.5px; text-transform: uppercase; padding: 8px 10px; border-bottom: 1px solid var(--line); font-weight: 700;}
td{padding: 9px 10px; border-bottom: 1px solid #212b3d; vertical-align: middle;}
tr:last-child td{border-bottom: none;}
tbody tr:hover{background: #1f2839;}
.tblwrap{overflow-x: auto;}
.pill{display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 700; background: #243044; color: #9fb0cc;}
.pill.owner{background: #3a2f14; color: #f0c04b;}
.pill.admin{background: #16304f; color: #69a8ff;}
.pill.ok{background: #12362a; color: #4fe0a8;}
.pill.bad{background: #3a1f26; color: #ff8b96;}
.muted{color: var(--mut);}
.empty{color: var(--mut); text-align: center; padding: 26px 10px; font-size: 13.5px;}
#modal{position: fixed; inset: 0; background: rgba(6,9,16,.74); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 80;}
#modal.on{display: flex;}
.sheet{background: var(--card); border: 1px solid var(--line); border-radius: 16px; width: 100%; max-width: 540px; max-height: 88vh; overflow-y: auto; padding: 18px;}
.sheet h3{margin: 0 0 14px 0; font-size: 16px;}
.sheet .acts{display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap;}
#toast{position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(140%); background: #22303f; border: 1px solid var(--line); color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 13.5px; z-index: 120; max-width: 92vw;}
#toast.on{transform: translateX(-50%) translateY(0);}
#toast.err{background: #43202a; border-color: #6b2b38;}
#toast.ok{background: #14382c; border-color: #215f48;}
#login{min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 18px; display: none;}
#login .box{width: 100%; max-width: 400px;}
#login .logo{margin: 0 auto 14px auto;}
#login h1{text-align: center; font-size: 21px; margin: 0 0 4px 0;}
#login p.sub{text-align: center; color: var(--mut); font-size: 13px; margin: 0 0 20px 0;}
.tt{width: 100%; border-collapse: separate; border-spacing: 4px; font-size: 12.5px;}
.tt th{background: #212c40; border-radius: 8px; padding: 7px 4px; text-align: center; color: var(--mut); font-size: 11px; text-transform: none;}
.tt th.dh{text-align: left; padding-left: 9px; min-width: 74px;}
.tt td{padding: 0; border: none;}
.slot{min-height: 56px; border-radius: 9px; background: #141c2b; border: 1px dashed #2a3548; display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 5px 7px; cursor: pointer;}
.slot:hover{border-color: var(--acc); background: #182233;}
.slot.full{background: #1d2c47; border: 1px solid #2f5590;}
.slot.off{background: #10161f; border: 1px solid #1c2532; cursor: default; opacity: 0.75;}
.slot.off:hover{background: #10161f; border-color: #1c2532;}
.slot.off small{color: #5a6b85; font-style: italic;}
/* ---- whole school grid ---- */
.schwrap{overflow: auto; max-height: 74vh; border: 1px solid #23314a; border-radius: 10px;}
table.sch{border-collapse: separate; border-spacing: 0; width: 100%;}
table.sch th, table.sch td{border-right: 1px solid #22304a; border-bottom: 1px solid #22304a; padding: 0;}
table.sch thead th{position: sticky; top: 0; z-index: 6; background: #16243a; color: #dfe8f6;
  font-size: 11px; font-weight: 650; padding: 6px 4px; text-align: center; white-space: nowrap;}
table.sch thead th.cday{left: 0; z-index: 8; min-width: 76px;}
table.sch thead th.cper{left: 76px; z-index: 8; min-width: 42px;}
table.sch td.cday{position: sticky; left: 0; z-index: 5; background: #101a2b; color: #cfe0f5;
  font-size: 11px; font-weight: 650; text-align: center; padding: 4px 3px; writing-mode: vertical-rl;
  transform: rotate(180deg); white-space: nowrap;}
table.sch td.cper{position: sticky; left: 76px; z-index: 5; background: #101a2b; color: #cfe0f5;
  font-size: 10.5px; font-weight: 650; text-align: center; padding: 3px 2px; white-space: nowrap;}
table.sch td.cper small{display: block; font-size: 8.5px; font-weight: 400; color: #7f93b3;}
table.sch td.cellb{padding: 2px; vertical-align: top;}
table.sch tr.altday td.cday, table.sch tr.altday td.cper{background: #14203a;}
.slcard{border-radius: 6px; padding: 3px 4px; min-height: 30px; font-size: 10.5px; line-height: 1.15;
  color: #10161f; border: 1px solid rgba(0,0,0,.18); cursor: pointer; overflow: hidden;}
.slcard b{display: block; font-size: 11px; font-weight: 700;}
.slcard small{display: block; font-size: 9px; font-weight: 600; opacity: .85;}
.slcard .sroom{display: block; font-size: 8.5px; opacity: .7;}
.slcard:hover{outline: 2px solid var(--acc);}
.slfree{min-height: 30px; border-radius: 6px; background: #0f1725; border: 1px dashed #22304a;
  display: flex; align-items: center; justify-content: center; font-size: 9px; color: #4a5c78;}
.slbrk{min-height: 30px; border-radius: 6px; background: #131b28; color: #6b7d99; font-size: 9.5px;
  display: flex; align-items: center; justify-content: center; font-style: italic;}
.schoolsummary{font-size: 12px; color: #93a1bb; margin-top: 8px;}
@media (max-width: 620px){
  .schwrap{max-height: 68vh;}
  table.sch thead th{font-size: 10px; padding: 5px 2px;}
  table.sch thead th.cday{min-width: 58px;} table.sch thead th.cper, table.sch td.cper{left: 58px;}
  table.sch thead th.cper{min-width: 34px;}
  .slcard{font-size: 9.5px; padding: 2px 3px; min-height: 26px;}
  .slcard b{font-size: 10px;}
  .slcard small{font-size: 8.5px;}
  .slcard .sroom{display: none;}
  .slfree, .slbrk{min-height: 26px;}
}
/* ---- printable one-page school timetable ---- */
.ptwrap{overflow-x: auto;}
.ptsheet{background: #fff; color: #10161f; padding: 10px; border-radius: 6px; min-width: 900px;}
.pt-head{display: flex; align-items: center; gap: 10px; border: 1px solid #767e94; background: #f5f7fb; padding: 6px 8px; margin-bottom: 6px;}
.pt-head .ptlogo{font-size: 20px; line-height: 1;}
.pt-head h1{font-size: 15px; margin: 0; letter-spacing: .3px; text-transform: uppercase;}
.pt-head .ptsub{font-size: 9.5px; color: #3a4658;}
.pt-head .ptyr{font-size: 9.5px; color: #3a4658;}
table.pt{width: 100%; border-collapse: collapse; table-layout: fixed;}
table.pt th, table.pt td{border: 1px solid #767e94; padding: 1px 2px; text-align: center; vertical-align: middle;}
table.pt thead th{background: #1f3a5f; color: #fff; font-size: 8.6px; padding: 3px 2px;}
table.pt thead th.ptcls{background: #eef4fc; color: #10161f; font-size: 8.4px;}
table.pt td.ptday{width: 22px; font-size: 8.6px; font-weight: 700; writing-mode: vertical-rl; transform: rotate(180deg); background: #fff;}
table.pt tr.ptodd td.ptper{background: #ecf1f9;}
table.pt td.ptper{width: 46px; font-size: 8.2px; font-weight: 700;}
table.pt td.ptper small{display: block; font-size: 6.6px; font-weight: 400; color: #5a6880;}
table.pt td.ptfree{background: #fafafa;}
.ptcell{padding: 1px 2px; font-size: 8.2px; line-height: 1.15;}
.ptcell b{display: block; font-size: 8.6px;}
.ptcell i{display: block; font-style: normal; font-size: 7.2px; color: #24304a;}
.ptsum{margin-top: 8px;}
.ptsum h2{font-size: 10px; margin: 0 0 4px 0; text-transform: uppercase; color: #1f3a5f;}
table.ptsumt{width: 100%; border-collapse: collapse;}
table.ptsumt th, table.ptsumt td{border: 1px solid #767e94; padding: 2px 4px; font-size: 8.4px; text-align: left;}
table.ptsumt thead th{background: #1f3a5f; color: #fff; font-size: 8.4px;}
table.ptsumt td.c{text-align: center;}
table.ptsumt tr:nth-child(even) td{background: #f6f8fc;}
.ptfoot{display: flex; gap: 12px; margin-top: 12px;}
.ptfoot div{flex: 1; font-size: 8.6px;}
.ptfoot .ptline{border-bottom: 1px solid #10161f; height: 14px; margin-top: 2px;}
.ptfoot .ptval{font-size: 8.2px; color: #24304a;}
.ptsheet.bw table.pt td, .ptsheet.bw table.pt th.ptcls, .ptsheet.bw table.ptsumt tr:nth-child(even) td{background: #fff !important;}
.ptsheet.bw table.pt thead th, .ptsheet.bw table.ptsumt thead th{background: #fff; color: #10161f; border-bottom-width: 2px;}
.ptsheet.bw .ptcell i{color: #10161f;}
@media print{
  @page{size: A4 landscape; margin: 8mm;}
  body{background: #fff !important;}
  #side, #mnav, #toast, #splash, #modal, .tabs, .topline, .ptctl, .navi{display: none !important;}
  #app{display: block !important;}
  main#main{display: block !important; padding: 0 !important; margin: 0 !important; max-width: none !important;}
  .card{border: none !important; background: none !important; padding: 0 !important; margin: 0 !important; box-shadow: none !important;}
  .ptwrap{overflow: visible !important;}
  .ptsheet{min-width: 0 !important; padding: 0 !important; border-radius: 0 !important;}
  table.pt{page-break-inside: avoid;}
  *{-webkit-print-color-adjust: exact; print-color-adjust: exact;}
}
.lcard{min-height: 58px; border-radius: 9px; background: #172238; border: 1px solid #2b4570; padding: 5px 7px; cursor: pointer; display: flex; flex-direction: column; gap: 1px;}
.lcard:hover{border-color: var(--acc); background: #1b2942;}
.lcard b{font-size: 12px; font-weight: 650; line-height: 1.2;}
.lcard small{font-size: 10.5px; color: #9fb0cc; line-height: 1.25;}
.lcard .lt{font-size: 10px; color: #7488a6;}
.lcard.pending{border-style: dashed; border-color: #c9a227; background: #26210f;}
.lcard.gone{display: none;}
.wkrow th{white-space: nowrap;}
.brkrow td{background: #101720; color: #6b7d99; font-size: 11px; text-align: center; font-style: italic;}
.dirtybar{position: sticky; top: 0; z-index: 5; background: #2a230f; border: 1px solid #c9a227; border-radius: 10px; padding: 9px 11px; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px;}
.pendlist{font-size: 12.5px; color: #cdd8e8;}
.daygrid{display: flex; flex-direction: column; gap: 8px;}
.dayrow{display: flex; gap: 10px; align-items: stretch;}
.daytime{min-width: 92px; font-size: 11.5px; color: #8ea3c2; padding-top: 6px;}
.daylessons{flex: 1; display: flex; flex-direction: column; gap: 6px;}
.daybreak{border: 1px dashed #23303f; border-radius: 9px; padding: 7px 10px; color: #6b7d99; font-size: 12px; font-style: italic;}
@media (max-width: 620px){
  .daytime{min-width: 70px; font-size: 10.5px;}
  .lcard b{font-size: 11.5px;} .lcard small{font-size: 10px;}
  .lcard .lt{display: none;}
}
.tcard{background: #1d2c47; border: 1px solid #2f5590; border-radius: 9px; padding: 5px 7px; margin: 2px 0; cursor: pointer; text-align: left;}
.tcard:hover{border-color: var(--acc);}
.tcsub{font-size: 12px; font-weight: 650; line-height: 1.2;}
.tcmeta{font-size: 10.5px; color: var(--mut); line-height: 1.25;}
.tctime{font-size: 10px; color: #7f90ab; margin-top: 1px;}
.tccls{font-size: 10px; color: #8fb0dd; margin-top: 2px; font-weight: 600;}
.tmore{font-size: 10px; color: var(--mut); text-align: center; padding: 1px 0;}
.brk{background: #10161f; border: 1px dashed #26313f; border-radius: 8px; padding: 6px 9px; font-size: 11.5px; color: #6c7d96; font-style: italic; text-align: center;}
.slot.emptycell{cursor: default; min-height: 40px; background: transparent; border-color: #212b38;}
.slot.emptycell small{color: #3f4f68;}
.tvv th.dh{min-width: 82px;}
.tfilters{display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px;}
.dayline{display: flex; gap: 8px; align-items: flex-start; margin-top: 8px;}
.dayline .dname{flex: 0 0 96px; font-size: 12px; color: var(--mut); padding-top: 8px;}
.dayline .dbody{flex: 1 1 auto; min-width: 0;}
@media (max-width: 620px){
  .dayline{flex-direction: column; gap: 2px;}
  .dayline .dname{flex: none; padding-top: 6px; font-weight: 600;}
  .tcard{padding: 7px 8px;}
  .tcsub{font-size: 12.5px;} .tcmeta{font-size: 11px;} .tctime{font-size: 10.5px;}
}
.slot b{font-size: 12px; font-weight: 650; line-height: 1.25;}
.slot small{font-size: 10.5px; color: var(--mut); line-height: 1.3;}
.slot .plus{color: #3f4f68; font-size: 16px; text-align: center;}
.legend{display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--mut); margin-top: 10px;}
.tabs{display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px;}
.tabs button{padding: 7px 13px; font-size: 13px; border-radius: 9px; background: #1c2637;}
.tabs button.on{background: var(--acc2); border-color: var(--acc); color: #fff;}
.chip{display: inline-flex; align-items: center; gap: 6px; background: #212c40; border: 1px solid var(--line); border-radius: 20px; padding: 4px 6px 4px 11px; font-size: 12.5px; margin: 0 6px 6px 0;}
.chip span.x{cursor: pointer; color: var(--mut); padding: 0 5px; font-weight: 700;}
.chip span.x:hover{color: var(--bad);}
.cur{border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; background: #151d2b;}
.curline{display: grid; grid-template-columns: 1.4fr 1.2fr .9fr 70px 34px; gap: 7px; margin-bottom: 7px; align-items: center;}
.curline select,.curline input{padding: 6px 8px; font-size: 12.5px;}
.note{background: #16233a; border-left: 3px solid var(--acc); padding: 10px 13px; border-radius: 8px; font-size: 12.5px; color: #b9c7de; margin-bottom: 14px;}
.warnbox{background: #3a2f14; border-left: 3px solid var(--warn); color: #f2cf8d; padding: 10px 13px; border-radius: 8px; font-size: 12.5px; margin-bottom: 12px;}
.errbox{background: #3a1f26; border-left: 3px solid var(--bad); color: #ffb3bb; padding: 10px 13px; border-radius: 8px; font-size: 12.5px; margin-bottom: 12px;}
.chk{display: flex; align-items: center; gap: 9px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 7px; background: #151d2b;}
.chk input{width: auto;}
.hero{background: linear-gradient(135deg, #1d2c47, #1b2434); border: 1px solid #2f5590; border-radius: 16px; padding: 18px; margin-bottom: 16px;}
.hero .hi{display: flex; align-items: center; gap: 14px; flex-wrap: wrap;}
.hero h1{font-size: 20px; margin: 0 0 3px 0; font-weight: 700;}
.hero .sub{color: #b9c7de; font-size: 13px;}
.logo{overflow: hidden;}
.logo img{width: 100%; height: 100%; object-fit: cover; border-radius: inherit;}
.logo.big{width: 56px; height: 56px; flex: 0 0 56px; border-radius: 15px; font-size: 26px;}
.steps{display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px;}
.step{display: flex; align-items: center; gap: 11px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: #151d2b; cursor: pointer;}
.step:hover{border-color: #2f5590;}
.step .sn{width: 26px; height: 26px; flex: 0 0 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: #243149; color: #9fb0cc;}
.step.done .sn{background: #14382c; color: #4fe0a8;}
.step b{display: block; font-size: 13.5px;}
.step small{display: block; color: var(--mut); font-size: 11.5px;}
.spinner{width: 26px; height: 26px; border: 3px solid #2a3548; border-top-color: var(--acc); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto;}
@keyframes spin{to{transform: rotate(360deg);}}
#splash{position: fixed; inset: 0; background: rgba(6,9,16,.72); z-index: 200; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; font-size: 13.5px; color: #dfe8f8;}
#splash.on{display: flex;}
#mnav{display: none;}
.statline{display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;}
@media(max-width: 880px){
#app{flex-direction: column;}
#side{width: 100%; flex: none; height: auto; position: sticky; top: 0; z-index: 50; border-right: none; border-bottom: 1px solid var(--line); padding: 8px 10px; background: var(--bg2);}
.brand{padding: 0;}
.brand small{display: none;}
.navi{display: none;}
#main{padding: 12px 12px 96px 12px;}
.hero{padding: 14px;}
.hero h1{font-size: 17px;}
.logo.big{width: 46px; height: 46px; flex: 0 0 46px; font-size: 22px; border-radius: 13px;}
#mnav{display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; background: #161d2d; border-top: 1px solid var(--line); padding: 5px 4px calc(5px + env(safe-area-inset-bottom)) 4px;}
#mnav .mb{flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; color: var(--mut); font-size: 10.5px; font-weight: 600; background: none; border: none; cursor: pointer;}
.navi a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.step:focus-visible,.kpi:focus-visible{outline: 2px solid var(--acc); outline-offset: 2px;}
.kpi[data-go2],.step[data-go3]{transition: border-color .15s, background .15s;}
#mnav .mb .mi{font-size: 17px; line-height: 1;}

<script>
var API = localStorage.getItem("tt_api") || "https://api.telebotcreator.com/new-webhook?data=gAAAAABq6kaStFBwgYQMtlq0EyMEX27YYfIjeo2iJbv0-CGVrYS5EnzDSE3CRGaKHazHhKn_i_9upvZry8rEedslOy7yvCpdjUOE08Lvsxe5A7og1qCNypYdWw1GQHsGqCgyr2lj3XTCznQpB9m4PmF9YpLufqTRIa9J0CejCNqD6nIqFIirTQao_oxtmXtMolYDC_pzxrob";
// There is no username/password login. The Telegram account that opens this app
// is the identity: initData is signed by Telegram and checked on the server.
var INIT = "";
var S = {school: {name: "", days: [], periods: []}, teachers: [], subjects: [], rooms: [], classes: [], sections: [], curriculum: {}, timetables: {}, users: [], me: null, conflicts: []};
var VIEW = "dash";
function tgApp(){
  try {
    if (window.Telegram && window.Telegram.WebApp) { return window.Telegram.WebApp; }
  } catch (e) {}
  return null;
}
function readInitData(){
  var a = tgApp();
  if (a && a.initData) { return String(a.initData); }
  return "";
}
function tgUser(){
  var a = tgApp();
  try {
    if (a && a.initDataUnsafe && a.initDataUnsafe.user) { return a.initDataUnsafe.user; }
  } catch (e) {}
  return null;
}

function $(id){ return document.getElementById(id); }
function esc(v){
  if (v === null || v === undefined) { return ""; }
  return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function toast(m, kind){
  var t = $("toast");
  t.className = "on" + (kind ? " " + kind : "");
  t.textContent = m;
  setTimeout(function(){ t.className = ""; }, 3800);
}
function api(action, extra){
  var payload = {action: action, init_data: INIT};
  if (extra) { for (var k in extra) { payload[k] = extra[k]; } }
  // The webhook only parses application/json: a text/plain or form-encoded body is
// rejected with HTTP 400, which made every call in this app fail.
  return fetch(API, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload)})
    .then(function(r){ return r.text(); })
    .then(function(txt){
      var d = null;
      try { d = JSON.parse(txt); } catch (e) { d = null; }
      if (!d) { throw new Error("The API did not return JSON. Check the endpoint URL. " + txt.slice(0, 120)); }
      if (d.ok === false) { throw new Error(d.error || "Request failed"); }
      // The webhook always answers with {"ok": true, "result": { ... }}.
      // Without this unwrap every field (token, school, teachers, ...) reads as undefined.
      var inner = d;
      if (d.result !== null && typeof d.result === "object") { inner = d.result; }
      if (!inner || typeof inner !== "object") {
        throw new Error("The API sent an unexpected answer. Please try again.");
      }
      if (inner.ok === false) { throw new Error(inner.error || "Request failed"); }
      return inner;
    }).catch(function(e){
      if (e && (e.message === "Failed to fetch" || e.name === "TypeError")) {
        throw new Error("Could not reach the API. Usually the page and the API are on different hosts and the browser blocked the call (CORS). Check the endpoint under Advanced: API endpoint, or send /api to the bot for the right link.");
      }
      throw e;
    });
}
function tById(list, id){
  for (var i = 0; i < list.length; i++) { if (list[i].id === id) { return list[i]; } }
  return null;
}
function nameOf(list, id){ var r = tById(list, id); return r ? (r.name || r.code || "") : ""; }
function canWrite(){
  if (!S.me) { return false; }
  if (S.me.permissions) { return !!S.me.permissions.can_write; }
  return S.me.role === "super_admin" || S.me.role === "school_admin";
}
function isSuper(){
  if (!S.me) { return false; }
  if (S.me.permissions && S.me.permissions.is_super) { return true; }
  return S.me.role === "super_admin";
}
function canEditTt(){
  // May this person change lessons? Administrators always may; a teacher only
  // when an administrator has allowed it, and then only their own lessons. This
  // is a separate right from canWrite, which unlocks the management screens.
  if (canWrite()) { return true; }
  if (!S.me) { return false; }
  if (S.me.permissions && S.me.permissions.can_edit_tt) { return true; }
  return false;
}
function isWrite(){ return canWrite(); }
function isOwner(){ return isSuper(); }
function roleLabel(){
  if (!S.me) { return ""; }
  return S.me.role_label || S.me.role || "";
}
function splash(on){
  var el = $("splash");
  if (!el) { return; }
  el.className = on ? "on" : "";
}
function logoSVG(size){
  var sc = (S.school || {});
  var em = sc.logo_emoji || "\uD83D\uDCC5";
  if (sc.logo_img) {
    return "<div class='logo" + (size === "big" ? " big" : "") + "'><img src='" + esc(sc.logo_img) + "' alt='School logo'></div>";
  }
  return "<div class='logo" + (size === "big" ? " big" : "") + "'>" + esc(em) + "</div>";
}
function greeting(){
  var hh = new Date().getHours();
  if (hh < 12) { return "Good morning"; }
  if (hh < 18) { return "Good afternoon"; }
  return "Good evening";
}
function refresh(){
  return api("state").then(function(d){
    applyState(d);
    return d;
  });
}
function needsSchool(d){
  // True only when this Telegram account belongs to no school yet. The backend
  // decides this; the page never guesses.
  if (!d) { return false; }
  return (d.needs_school === true) || (d.school === null) || (d.school === undefined);
}
function fail(e){ toast(e.message || String(e), "err"); }

// There is no login screen. The dashboard opens immediately; the only thing that
// can stop it is Telegram not being present (the page was opened in a plain browser).
function blockScreen(title, msg, canRetry){
  $("app").style.display = "none";
  var box = $("blocked");
  if (!box) { return; }
  box.style.display = "flex";
  var h = "<div class='logo big'>&#128197;</div><h1>" + esc(title) + "</h1><p class='sub'>" + esc(msg) + "</p>";
  if (canRetry) { h = h + "<button class='primary' id='blkRetry'>Try again</button>"; }
  box.innerHTML = "<div class='box'>" + h + "</div>";
  if (canRetry && $("blkRetry")) { $("blkRetry").onclick = function(){ boot(); }; }
}
function unblock(){
  var box = $("blocked");
  if (box) { box.style.display = "none"; }
  $("app").style.display = "flex";
}
function boot(){
  INIT = readInitData();
  unblock();
  if (!API) {
    blockScreen("Almost ready", "The app has no API endpoint yet. Open it from the bot's button, or send /api to the bot.", true);
    return;
  }
  if (!INIT) {
    blockScreen("Open this app in Telegram",
      "This is a Telegram Mini App. Telegram provides your identity, so there is no password: open it from the button in the bot's chat.", true);
    return;
  }
  splash(true);
  api("state").then(function(d){
    splash(false);
    applyState(d);
    if (needsSchool(d)) {
      setupView();
      return;
    }
    setupShell(false);
    go("dash");
  }).catch(function(e){
    splash(false);
    blockScreen("Could not open the app", e.message || String(e), true);
  });
}
function applyState(d){
  S.school = d.school || S.school;
  S.teachers = d.teachers || [];
  S.subjects = d.subjects || [];
  S.rooms = d.rooms || [];
  S.classes = d.classes || [];
  S.sections = d.sections || [];
  S.curriculum = d.curriculum || {};
  S.timetables = d.timetables || {};
  S.users = d.users || [];
  S.me = d.me || null;
  S.conflicts = d.conflicts || [];
  S.notice = d.notice || "";
  S.invite = d.invite || "";
  S.schoolId = d.school_id || "";
  var bn = $("brandName");
  if (bn && bn.parentNode && bn.parentNode.parentNode) {
    var brandBox = bn.parentNode.parentNode;
    var sig = String((S.school || {}).logo_img || "") + String((S.school || {}).logo_emoji || "");
    if (brandBox.getAttribute("data-logo") !== sig) {
      brandBox.setAttribute("data-logo", sig);
      var oldLogo = brandBox.querySelector(".logo");
      if (oldLogo) { oldLogo.outerHTML = logoSVG(""); }
    }
  }
  if (bn) { bn.textContent = S.school.name || "My School"; }
  var bu = $("brandUser");
  if (bu) { bu.textContent = (S.me ? (S.me.name + " - " + roleLabel()) : ""); }
}
function logout(){
  // No sign-out: your Telegram account is your identity. Closing the app is enough.
  toast("You stay signed in with your Telegram account.", "ok");
  go("dash");
}
// ---- first run: create a school, or join one with an invitation code ----
var SETUP_MODE = "create";
var NEW_SCHOOL = {name: "", location: "", academic_year: "", school_days: "5",
                  periods_per_day: "6", start_time: "08:00", end_time: "13:00",
                  logo_emoji: ""};
function setupShell(on){
  var sd = $("side");

  var mn = $("mnav");
  if (mn) { mn.style.display = on ? "none" : ""; }
}
function setupView(){
  // Shown only when this Telegram account belongs to no school yet. Nothing is

  SETUP_MODE = SETUP_MODE || "create";
  setupShell(true);
  var h = "<div style='max-width:640px;margin:0 auto'>";

       + "Your school gets its own private workspace, separate from every other school.</div></div>";
  h = h + "<div class='card'><div style='display:flex;gap:8px;margin-bottom:14px'>";

  h = h + "<button class='sm" + (SETUP_MODE === "join" ? " primary" : "") + "' id='stJoin'>Join with a code</button>";

  if (SETUP_MODE === "join") {

    h = h + "<label class='f'><span>Logo symbol</span><input id='stLogo' value='" + esc(NEW_SCHOOL.logo_emoji) + "' maxlength='4' placeholder='an emoji'></label></div>";
    h = h + "<div class='row'><label class='f'><span>School days per week</span><input id='stDays' type='number' min='1' max='7' value='" + esc(NEW_SCHOOL.school_days) + "'></label>";
    h = h + "<label class='f'><span>Periods per day</span><input id='stPer' type='number' min='1' max='14' value='" + esc(NEW_SCHOOL.periods_per_day) + "'></label></div>";
    h = h + "<div class='row'><label class='f'><span>School starts</span><input id='stStart' value='" + esc(NEW_SCHOOL.start_time) + "' placeholder='08:00'></label>";
    h = h + "<label class='f'><span>School ends</span><input id='stEnd' value='" + esc(NEW_SCHOOL.end_time) + "' placeholder='13:00'></label></div>";
    h = h + "<div class='note'>You become the School Administrator of this new school. "
         + "Teachers, subjects, classes and timetables all start empty, so you add your own.</div>";
    h = h + "<button class='primary' id='stGoCreate' style='margin-top:10px'>Create my school</button>";
  }
  h = h + "</div>";
  h = h + "<div id='stMsg'></div>";
  h = h + "</div>";
  $("main").innerHTML = h;
  if ($("stNew")) { $("stNew").onclick = function(){ SETUP_MODE = "create"; setupView(); }; }
  if ($("stJoin")) { $("stJoin").onclick = function(){ SETUP_MODE = "join"; setupView(); }; }
  if ($("stGoCreate")) { $("stGoCreate").onclick = function(){ createSchool(); }; }
  if ($("stGoJoin")) { $("stGoJoin").onclick = function(){ joinSchool(); }; }
}
function setupFail(msg){
  if ($("stMsg")) { $("stMsg").innerHTML = "<div class='errbox'>" + esc(msg) + "</div>"; }
  else { toast(msg, "err"); }
}
function createSchool(){
  var nm = $("stName").value.trim();
  if (nm === "") { setupFail("Enter your school name."); $("stName").focus(); return; }
  var body = {name: nm,
              location: $("stLoc").value.trim(),
              academic_year: $("stYear").value.trim(),
              logo_emoji: $("stLogo").value.trim(),
              school_days: $("stDays").value,
              periods_per_day: $("stPer").value,
              start_time: $("stStart").value.trim(),
              end_time: $("stEnd").value.trim()};
  splash(true);
  api("school.create", {school: body}).then(function(d){
    splash(false);
    SETUP_MODE = "create";
    toast("School created. You are the administrator.", "ok");
    refresh().then(function(){ setupShell(false); go("dash"); });
  }).catch(function(e){ splash(false); setupFail(e.message || String(e)); });
}
function joinSchool(){
  var code = $("stCode").value.trim().toUpperCase();
  if (code === "") { setupFail("Enter the invitation code."); $("stCode").focus(); return; }
  splash(true);
  api("school.join", {invite: code}).then(function(d){
    splash(false);
    toast("You joined the school.", "ok");
    refresh().then(function(){ setupShell(false); go("dash"); });
  }).catch(function(e){ splash(false); setupFail(e.message || String(e)); });
}


var NAV = [
  {id: "dash", ic: "\u25A6", label: "Dashboard"},
  {id: "teachers", ic: "\u263A", label: "Teachers"},
  {id: "classes", ic: "\u25A4", label: "Classes"},
  {id: "subjects", ic: "\u2687", label: "Subjects"},
  {id: "rooms", ic: "\u25A3", label: "Classrooms"},
  {id: "periods", ic: "\u23F0", label: "Periods"},
  {id: "curriculum", ic: "\u270E", label: "Curriculum"},
  {id: "generate", ic: "\u2692", label: "Generate Timetable"},
  {id: "timetable", ic: "\u25A6", label: "View Timetable"},
  {id: "export", ic: "\u2913", label: "Export"},
  {id: "print", ic: "\u2316", label: "Print School Timetable"},
  {id: "school", ic: "\u2691", label: "Settings"}
];
var MNAV = [
  {id: "dash", ic: "\u25A6", label: "Home"},
  {id: "teachers", ic: "\u263A", label: "Teachers"},
  {id: "classes", ic: "\u25A4", label: "Classes"},
  {id: "timetable", ic: "\u25A6", label: "Timetable"},
  {id: "menu", ic: "\u2261", label: "More"}
];
function navAllowed(v){
  // Teachers and students never see school management pages.
  if (canWrite()) { return true; }
  var readOnly = ["dash", "timetable", "export", "menu"];
  if (isSuper()) { readOnly.push("admins"); }
  return readOnly.indexOf(v) >= 0;
}
function drawNav(){
  var h = "";
  for (var i = 0; i < NAV.length; i++) {
    var n = NAV[i];
    if (!navAllowed(n.id)) { continue; }
    var badge = "";
    if (n.id === "conflicts" && S.conflicts.length > 0) { badge = "<span class='badge'>" + S.conflicts.length + "</span>"; }
    h = h + "<a class='" + (VIEW === n.id ? "on" : "") + "' data-go='" + n.id + "'><span class='ic'>" + n.ic + "</span>" + n.label + badge + "</a>";
  }
  $("nav").innerHTML = h;
  var links = $("nav").getElementsByTagName("a");
  for (var j = 0; j < links.length; j++) {
    links[j].onclick = function(){ go(this.getAttribute("data-go")); };
  }
  var mh = "";
  var tail = ["subjects", "rooms", "periods", "settings", "curriculum", "generate", "timetable", "conflicts", "export", "school", "admins", "menu"];
  for (var m = 0; m < MNAV.length; m++) {
    var mn = MNAV[m];
    if (mn.id !== "menu" && !navAllowed(mn.id)) { continue; }
    var on = VIEW === mn.id;
    if (mn.id === "menu") { on = tail.indexOf(VIEW) >= 0; }
    var dot = (mn.id === "menu" && S.conflicts.length > 0) ? "<span class='dot'></span>" : "";
    mh = mh + "<button class='mb" + (on ? " on" : "") + "' data-mgo='" + mn.id + "'><span class='mi'>" + mn.ic + "</span>" + dot + mn.label + "</button>";
  }
  $("mnav").innerHTML = mh;
  var mbs = $("mnav").getElementsByTagName("button");
  for (var k = 0; k < mbs.length; k++) {
    mbs[k].onclick = function(){
      var v = this.getAttribute("data-mgo");
      if (v === "menu") { menuView(); return; }
      go(v);
    };
  }
}
function menuView(){
  VIEW = "menu";
  drawNav();
  var items = [
    {v: "dash", l: "Dashboard", d: "Counts and generation status"},
    {v: "teachers", l: "Teachers", d: "Staff and their subjects"},
    {v: "classes", l: "Classes", d: "Classes and sections"},
    {v: "subjects", l: "Subjects", d: "What is taught"},
    {v: "rooms", l: "Classrooms", d: "Where lessons happen"},
    {v: "periods", l: "Periods", d: "School days and the periods of one day"},
    {v: "curriculum", l: "Curriculum", d: "Periods per week per class"},
    {v: "generate", l: "Generate timetable", d: "Automatic placement"},
    {v: "timetable", l: "View timetable", d: "Weekly grid"},
    {v: "conflicts", l: "Conflicts", d: "Teacher and room clashes"},
    {v: "export", l: "Export", d: "PDF, Excel, CSV"},
    {v: "school", l: "Settings", d: "School name, periods, conflicts, administrators"}
  ];
  var h = head("All pages", (S.school.name || "My School") + " - " + ((S.me || {}).name || "") + ", " + roleLabel());
  h = h + "<div class='card'><div class='steps'>";
  var shown = 0;
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (!navAllowed(it.v)) { continue; }
    shown = shown + 1;
    var warn = (it.v === "conflicts" && S.conflicts.length > 0) ? " - " + S.conflicts.length + " found" : "";
    h = h + "<div class='step' data-go3='" + it.v + "'><div class='sn'>" + shown + "</div><div><b>" + esc(it.l) + "</b><small>" + esc(it.d) + warn + "</small></div></div>";
  }
  h = h + "</div></div>";
  h = h + "<div class='card'><h2>Your account</h2><div class='muted' style='font-size:13px;margin-bottom:10px'>"
       + esc((S.me || {}).name || "") + " - " + esc(roleLabel()) + " - Telegram account "
       + esc((S.me || {}).tg_id || "") + "</div>"
       + "<div class='note'>You are signed in through Telegram, so there is no password and nothing to sign out of.</div></div>";
  $("main").innerHTML = h;
  var gs = $("main").querySelectorAll("[data-go3]");
  for (var j = 0; j < gs.length; j++) {
    gs[j].setAttribute("role", "button");
    gs[j].setAttribute("tabindex", "0");
    gs[j].onclick = function(){ go(this.getAttribute("data-go3")); };
    gs[j].onkeydown = function(ev){ if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(this.getAttribute("data-go3")); } };
  }
  }
function go(v){
  VIEW = v;
  drawNav();
  if (v === "dash") { dashView(); }
  else if (v === "teachers") { teachersView(); }
  else if (v === "classes") { classesPage(); }
  else if (v === "subjects") { subjectsPage(); }
  else if (v === "rooms") { roomsPage(); }
  else if (v === "periods") { schedView(); }
  else if (v === "settings" || v === "school") { settingsView(); }
  else if (v === "curriculum") { currView(); }
  else if (v === "generate") { genView(); }
  else if (v === "timetable") { ttPage(); }
  else if (v === "conflicts") { confView(); }
  else if (v === "export") { expView(); }
  else if (v === "print") { printView(); }
  else if (v === "admins") { admView(); }
  bindTabs();
}
function tabsHTML(active){
  var defs = [{v: "school", l: "School & periods"},
              {v: "conf", l: "Conflicts" + (S.conflicts.length > 0 ? " (" + S.conflicts.length + ")" : "")}];
  if (isSuper()) { defs.push({v: "adm", l: "Users"}); }
  var h = "<div class='tabs'>";
  for (var i = 0; i < defs.length; i++) {
    h = h + "<button class='" + (active === defs[i].v ? "on" : "") + "' data-tabv='" + defs[i].v + "'>" + esc(defs[i].l) + "</button>";
  }
  return h + "</div>";
}
function bindTabs(){
  var bs = $("main").querySelectorAll("[data-tabv]");
  for (var i = 0; i < bs.length; i++) {
    bs[i].onclick = function(){
      var v = this.getAttribute("data-tabv");
      if (v === "conf") { go("conflicts"); }
      else if (v === "adm") { go("admins"); }
      else { go("settings"); }
    };
  }

function fieldHTML(f, val){

function readForm(){
  var out = {};
  var ins = $("mBody").querySelectorAll("[data-f]");
  for (var i = 0; i < ins.length; i++) { out[ins[i].getAttribute("data-f")] = ins[i].value; }
  var ms = $("mBody").querySelectorAll("[data-multi]");
  for (var j = 0; j < ms.length; j++) {
    var k = ms[j].getAttribute("data-multi");
    if (!out[k]) { out[k] = []; }
    if (ms[j].checked) { out[k].push(ms[j].value); }
  }
  return out;
}

function badTime(v){
  if (v === "") { return false; }
  if (!/^[0-9]{1,2}:[0-9]{2}$/.test(v)) { return true; }
  var parts = v.split(":");
  var hh = parseInt(parts[0], 10);
  var mm = parseInt(parts[1], 10);
  return hh > 23 || mm > 59;
}

function doExport(fmt){
  var req = {scope: EXP_SCOPE};
  if (EXP_SCOPE === "class" || EXP_SCOPE === "section" || EXP_SCOPE === "teacher") {
    if (EXP_TARGET === "") {
      var sel = $("expTarget");
      if (sel) { EXP_TARGET = sel.value; }
    }
    if (EXP_TARGET === "") { toast("Choose which one to export.", "err"); return; }
    req.target = EXP_TARGET;
    if (EXP_SCOPE === "teacher") { req.teacher_id = EXP_TARGET; }
  }
  if (EXP_SCOPE === "grade") {
    if (EXP_GRADE === "") {
      var gs = $("expGrade");
      if (gs) { EXP_GRADE = gs.value; }
    }
    if (EXP_GRADE === "") { toast("Choose a grade.", "err"); return; }
    req.grade = EXP_GRADE;
  }
  if (String(EXP_DAY) !== "") { req.day = parseInt(EXP_DAY, 10); }
  $("expOut").innerHTML = "<div class='muted'>Building the file...</div>";
  api("export." + fmt, req).then(function(d){
    var content = d.content || "";
    var mime = d.mime || "text/plain";
    if (content === "") {
      $("expOut").innerHTML = "<div class='warnbox'>The server returned an empty file, so nothing was downloaded.</div>";
      return;
    }
    if (d.encoding === "base64") {
      var bin = atob(content);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) { bytes[i] = bin.charCodeAt(i); }
      saveBlob(new Blob([bytes], {type: mime}), d.filename);
    } else {
      saveBlob(new Blob([content], {type: mime}), d.filename);
    }
    var kb = content.length / 1024;
    if (kb < 1) { kb = 1; }
    var summary = "<div class='note'>Saved " + esc(d.filename) + " (" + Math.round(kb) + " KB, " +
                  (d.lessons || 0) + " lesson(s)" + (d.pages ? ", " + d.pages + " page(s)" : "") +
                  "). Check your downloads.</div>";
    $("expOut").innerHTML = summary;
  }).catch(function(e){ $("expOut").innerHTML = ""; fail(e); });
}
function saveBlob(blob, filename){
  if (window.navigator && window.navigator.msSaveOrOpenBlob) {
    window.navigator.msSaveOrOpenBlob(blob, filename);
    return;
  }
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
  if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
    try { window.Telegram.WebApp.HapticFeedback.notificationOccurred("success"); } catch (e) {}
  }
}

var PDF_SENDING = false;
function pdfStatusHtml(kind, text, withRetry){
  var cls = "note";
  if (kind === "err") { cls = "errbox"; }

function pdfShowStatus(kind, text, withRetry){
  if (!$("pMsg")) { return; }
  $("pMsg").innerHTML = pdfStatusHtml(kind, text, withRetry);
  if (withRetry && $("pRetry")) { $("pRetry").onclick = function(){ sendPdfToTelegram(); }; }
  if ($("pSend")) { $("pSend").disabled = PDF_SENDING; }
}
function sendPdfToTelegram(){
  // The bot delivers the file to this user's own Telegram chat. Repeated taps
  // while the first request is still running are ignored on purpose, so the
  // same PDF cannot be delivered twice.
  if (PDF_SENDING) { return; }
  if (!PRINT_DATA) {
    pdfShowStatus("err", "Wait for the preview to appear first, then press Send again.", false);
    return;
  }
  PDF_SENDING = true;
  pdfShowStatus("busy", "Sending PDF to Telegram...", false);
  api("print.send", {print_opts: printOptsSend()}).then(function(d){
    PDF_SENDING = false;
    if (d && d.sent) {
      var msg = "PDF sent successfully! Open your Telegram bot chat to download it.";
      if (d.duplicate) {
        msg = "This PDF was just sent. Open your Telegram bot chat to download it.";
      }
      pdfShowStatus("ok", msg + " (" + (d.filename || "School timetable") + ")", false);
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
        try { window.Telegram.WebApp.HapticFeedback.notificationOccurred("success"); } catch (e) {}
      }
    } else {
      var why = (d && d.error) ? String(d.error) : "Unable to send PDF. Please try again.";
      pdfShowStatus("err", why, true);
    }
    if ($("pSend")) { $("pSend").disabled = false; }
  }).catch(function(e){
    PDF_SENDING = false;
    var m = "Unable to send PDF. Please try again.";
    if (e && e.message) { m = String(e.message); }
    pdfShowStatus("err", m, true);
    if ($("pSend")) { $("pSend").disabled = false; }
  });
}

function editTeacher(row){
  var title = row ? ("Edit " + (row.name || "teacher")) : "Add teacher";
  modal(title, teacherFormHtml(row), function(done){
    var data = readTeacherForm();
    if (data.code === "") { toast("Teacher ID is required.", "err"); done(); if ($("tCode")) { $("tCode").focus(); } return; }
    if (data.name === "") { toast("Full name is required.", "err"); done(); if ($("tName")) { $("tName").focus(); } return; }
    if (isNaN(data.max_per_day) || data.max_per_day < 0) { toast("Max periods per day must be 0 or more.", "err"); done(); return; }
    if (isNaN(data.max_per_week) || data.max_per_week < 0) { toast("Max periods per week must be 0 or more.", "err"); done(); return; }
    if (data.max_per_day > 0 && data.max_per_week > 0 && data.max_per_day > data.max_per_week) {
      toast("Per day (" + data.max_per_day + ") cannot be more than per week (" + data.max_per_week + ").", "err"); done(); return;
    }

    for (var i = 0; i < (S.teachers || []).length; i++) {

      closeModal();

  var days = ((S.school || {}).days) || [];
  var periods = ((S.school || {}).periods) || [];
  if (days.length === 0 || periods.length === 0) { return "<div class='muted'>Set the school week first.</div>"; }
  var h = "<div class='tblwrap'><table class='av'><thead><tr><th>Day</th>";
  for (var p = 0; p < periods.length; p++) { h = h + "<th style='text-align:center'>" + esc(periods[p].name || ("P" + (p + 1))) + "</th>"; }
  h = h + "</tr></thead><tbody>";
  for (var d = 0; d < days.length; d++) {
    h = h + "<tr><th style='text-align:left'>" + esc(days[d]) + "</th>";
    for (var q = 0; q < periods.length; q++) {
      var slot = d + "-" + q;
      var on = un.indexOf(slot) >= 0 ? " checked" : "";
      h = h + "<td style='text-align:center'><input type='checkbox' class='r-un' data-slot='" + slot + "'" + on + " style='width:auto'></td>";
    }
    h = h + "</tr>";
  }
  return h + "</tbody></table></div>";
}

  h = h + "<div class='muted' style='font-size:12px;margin-top:4px'>Leave every box clear when the room is always available.</div></div>";

function readRoomForm(){
  var out = {"code": "", "name": "", "kind": "", "capacity": 0, "unavailable": [], "equipment": []};
  if ($("rCode")) { out.code = $("rCode").value.trim(); }
  if ($("rName")) { out.name = $("rName").value.trim(); }
  if ($("rKind")) { out.kind = $("rKind").value; }
  if ($("rCap")) { out.capacity = parseInt($("rCap").value || "0", 10); }
  if ($("rEq")) {
    var parts = $("rEq").value.split(",");
    for (var i = 0; i < parts.length; i++) {
      var e = parts[i].replace(/^\s+|\s+$/g, "");
      if (e !== "") { out.equipment.push(e); }
    }
  }
  var us = $("mBody").querySelectorAll(".r-un");
  for (var j = 0; j < us.length; j++) { if (us[j].checked) { out.unavailable.push(us[j].getAttribute("data-slot")); } }
  return out;
}
function saveRoom(rid){
  var row = rid ? tById(S.rooms, rid) : null;
  modal(row ? ("Edit " + (row.name || "room")) : "Add classroom", roomFormHtml(rid), function(done){
    var data = readRoomForm();
    if (data.code === "") { toast("Room ID is required.", "err"); done(); return; }
    if (data.name === "") { toast("Room name is required.", "err"); done(); return; }
    if (isNaN(data.capacity) || data.capacity < 0) { toast("Maximum capacity must be 0 or more.", "err"); done(); return; }
    var dup = false;
    for (var i = 0; i < (S.rooms || []).length; i++) {
      var r = S.rooms[i];
      if (row && r.id === row.id) { continue; }
      if (String(r.code || "").toLowerCase() === data.code.toLowerCase()) { dup = true; }
    }
    if (dup) { toast("Room ID " + data.code + " is already used.", "err"); done(); return; }
    if (data.capacity > 0 && row) {
      var need = roomSeatNeed(row.id);
      if (need > data.capacity) { toast("A class of " + need + " is seated here. Capacity cannot be lower.", "err"); done(); return; }
    }
    if (row) { data.id = row.id; }
    api("room.save", {data: data}).then(function(){
      closeModal();
      toast(row ? "Classroom saved" : "Classroom added", "ok");
      refresh().then(function(){ go("rooms"); });
    }).catch(function(e){ done(); fail(e); });
  }, "Save");
}
function viewRoom(rid){
  var r = tById(S.rooms, rid);
  if (!r) { return; }
  var days = ((S.school || {}).days) || [];
  var periods = ((S.school || {}).periods) || [];
  var un = r.unavailable || [];
  var unText = [];
  for (var i = 0; i < un.length; i++) {
    var pp = String(un[i]).split("-");
    var dn = days[parseInt(pp[0], 10)] || "?";
    var pn = (periods[parseInt(pp[1], 10)] || {}).name || "?";
    unText.push(dn + " " + pn);
  }
  var h = "<div class='tblwrap'><table><tbody>";
  h = h + "<tr><td class='muted'>Room ID</td><td><b>" + esc(r.code || "-") + "</b></td></tr>";
  h = h + "<tr><td class='muted'>Name</td><td>" + esc(r.name) + "</td></tr>";
  h = h + "<tr><td class='muted'>Type</td><td>" + esc(r.kind || "-") + "</td></tr>";
  h = h + "<tr><td class='muted'>Maximum capacity</td><td>" + esc(r.capacity > 0 ? r.capacity : "no limit") + "</td></tr>";
  h = h + "<tr><td class='muted'>Equipment</td><td>" + esc((r.equipment || []).join(", ") || "-") + "</td></tr>";
  h = h + "<tr><td class='muted'>Not available</td><td>" + esc(unText.join(", ") || "always available") + "</td></tr>";
  h = h + "<tr><td class='muted'>Assigned to</td><td>" + roomAssigned(r.id) + " class(es)</td></tr>";
  h = h + "<tr><td class='muted'>On the timetable</td><td>" + roomLessons(r.id) + " lesson(s)</td></tr>";
  h = h + "</tbody></table></div>";
  modal("Room " + (r.code || r.name), h, function(){ closeModal(); }, "Close");
}
function delRoom(rid){
  var r = tById(S.rooms, rid);
  if (!r) { return; }
  var lessons = roomLessons(r.id);
  var assigned = roomAssigned(r.id);
  var body = "<div class='errbox'>Delete " + esc(r.name) + " (ID " + esc(r.code || "") + ")?</div>";
  if (lessons > 0 || assigned > 0) {
    body = body + "<div class='warnbox'><b>This room is still in use.</b> ";
    if (lessons > 0) { body = body + lessons + " scheduled lesson(s) use it. "; }
    if (assigned > 0) { body = body + "It is the assigned classroom of " + assigned + " class(es). "; }
    body = body + "Deleting it clears the room from those lessons.</div>";
  } else {
    body = body + "<div class='note'>Nothing uses this room yet.</div>";
  }
  modal(lessons > 0 ? "Delete a room that is in use" : "Delete classroom", body, function(done){
    var extra = {entity: "rooms", id: r.id};
    if (lessons > 0 || assigned > 0) { extra.force = true; }
    api("entity.delete", extra).then(function(){
      closeModal();
      toast("Classroom deleted", "ok");
      refresh().then(function(){ go("rooms"); });
    }).catch(function(e){ done(); fail(e); });
  }, "Delete");
}

// ---------------- School schedule configuration ----------------
var DAYNAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
var SCHED = [];
var SCHED_DAYS = [];
var SCHED_HOL = [];
var SCHED_UN = [];
var SCHED_INIT = false;
var SCHED_MSG = "";

function schedLoad(){
  var sc = S.school || {};
  var ps = sc.periods || [];
  SCHED = [];
  for (var i = 0; i < ps.length; i++) {
    var k = String(ps[i].kind || "lesson");
    SCHED.push({name: ps[i].name || ("P" + (i + 1)), kind: k,
                start: ps[i].start || "", end: ps[i].end || ""});
  }
  if (SCHED.length === 0) {
    SCHED.push({name: "P1", kind: "lesson", start: "08:00", end: "08:45"});
  }
  SCHED_DAYS = [];
  var have = sc.days || [];
  for (var j = 0; j < have.length; j++) {
    var d = String(have[j]).trim();
    if (d !== "" && SCHED_DAYS.indexOf(d) < 0) { SCHED_DAYS.push(d); }
  }
  SCHED_HOL = [];
  var hol = sc.holidays || [];
  for (var k2 = 0; k2 < hol.length; k2++) { SCHED_HOL.push(String(hol[k2])); }
  SCHED_UN = [];
  var un = sc.unavailable || [];
  for (var m = 0; m < un.length; m++) { SCHED_UN.push(String(un[m])); }
}
function schedInit(){
  if (SCHED_INIT) { return; }
  schedLoad();
  SCHED_INIT = true;
}
function dayChoices(){
  var out = [];
  for (var i = 0; i < DAYNAMES.length; i++) { out.push(DAYNAMES[i]); }
  for (var j = 0; j < SCHED_DAYS.length; j++) {
    if (out.indexOf(SCHED_DAYS[j]) < 0) { out.push(SCHED_DAYS[j]); }
  }
  return out;
}
function schedMin(v){
  var t = String(v || "");
  if (!/^[0-9]{1,2}:[0-9]{2}$/.test(t)) { return -1; }
  var p = t.split(":");
  var hh = parseInt(p[0], 10);
  var mm2 = parseInt(p[1], 10);
  if (hh < 0 || hh > 23 || mm2 < 0 || mm2 > 59) { return -1; }
  return hh * 60 + mm2;
}
function schedPad(n){ return (n < 10 ? "0" : "") + n; }
function schedHHMM(mins){
  if (mins < 0) { return ""; }
  return schedPad(Math.floor(mins / 60)) + ":" + schedPad(mins % 60);
}
function lessonIndexes(){
  var out = [];
  for (var i = 0; i < SCHED.length; i++) { if (SCHED[i].kind === "lesson") { out.push(i); } }
  return out;
}
function collectSched(){
  var box = $("schBox");
  if (!box) { return; }
  for (var i = 0; i < SCHED.length; i++) {
    var n = box.querySelector("[data-sn='" + i + "']");
    var k = box.querySelector("[data-sk='" + i + "']");
    var s = box.querySelector("[data-ss='" + i + "']");
    var e = box.querySelector("[data-se='" + i + "']");
    if (n) { SCHED[i].name = n.value.trim(); }
    if (k) { SCHED[i].kind = k.value; }
    if (s) { SCHED[i].start = s.value; }
    if (e) { SCHED[i].end = e.value; }
  }
  var us = $("main").querySelectorAll(".u-on");
  var keep = [];
  for (var j = 0; j < us.length; j++) { if (us[j].checked) { keep.push(us[j].getAttribute("data-key")); } }
  SCHED_UN = keep;
}
function scheddraw(){
  var rd = isWrite() ? "" : " disabled";
  var h = "";
  for (var i = 0; i < SCHED.length; i++) {
    var b = SCHED[i];
    var isLes = b.kind === "lesson";
    h = h + "<div style='display:grid;grid-template-columns:1.2fr 1fr 0.9fr 0.9fr 38px;gap:6px;margin-top:7px;align-items:center'>";
    h = h + "<input data-sn='" + i + "' value='" + esc(b.name) + "' maxlength='12' placeholder='P1'" + rd + ">";
    h = h + "<select data-sk='" + i + "'" + rd + ">";
    h = h + "<option value='lesson'" + (isLes ? " selected" : "") + ">lesson</option>";
    h = h + "<option value='break'" + (b.kind === "break" ? " selected" : "") + ">break</option>";
    h = h + "<option value='lunch'" + (b.kind === "lunch" ? " selected" : "") + ">lunch</option>";
    h = h + "</select>";
    h = h + "<input type='time' data-ss='" + i + "' value='" + esc(b.start) + "'" + rd + ">";
    h = h + "<input type='time' data-se='" + i + "' value='" + esc(b.end) + "'" + rd + ">";
    h = h + "<button class='sm bad' data-sx='" + i + "'" + rd + " title='Remove this block'>&times;</button>";
    h = h + "</div>";
  }
  $("schBox").innerHTML = h;
  var xs = $("schBox").querySelectorAll("[data-sx]");
  for (var k = 0; k < xs.length; k++) {
    xs[k].onclick = function(){
      collectSched();
      var idx = parseInt(this.getAttribute("data-sx"), 10);
      var keep = [];
      for (var m = 0; m < SCHED.length; m++) { if (m !== idx) { keep.push(SCHED[m]); } }
      SCHED = keep;
      schedView();
    };
  }
  var sels = $("schBox").querySelectorAll("[data-sk]");
  for (var s2 = 0; s2 < sels.length; s2++) {
    sels[s2].onchange = function(){ collectSched(); schedView(); };
  }
}
function schedUnHtml(){
  var cols = lessonIndexes();
  if (SCHED_DAYS.length === 0 || cols.length === 0) {
    return "<div class='muted' style='font-size:12.5px'>Choose working days and at least one lesson period first.</div>";
  }
  var h = "<div class='tblwrap'><table class='av'><thead><tr><th>Day</th>";
  for (var c = 0; c < cols.length; c++) {
    h = h + "<th style='text-align:center'>" + esc(SCHED[cols[c]].name) + "</th>";
  }
  h = h + "</tr></thead><tbody>";
  for (var d = 0; d < SCHED_DAYS.length; d++) {
    var dname = SCHED_DAYS[d];
    var hol = SCHED_HOL.indexOf(dname) >= 0;
    h = h + "<tr><th style='text-align:left'>" + esc(dname) + (hol ? " <span class='muted'>(holiday)</span>" : "") + "</th>";
    for (var q = 0; q < cols.length; q++) {
      var key = d + "-" + cols[q];
      var on = SCHED_UN.indexOf(key) >= 0 ? " checked" : "";
      h = h + "<td style='text-align:center'><input type='checkbox' class='u-on' data-key='" + key + "'" + on + (hol ? " disabled" : "") + " style='width:auto'></td>";
    }
    h = h + "</tr>";
  }
  return h + "</tbody></table></div>";
}
function schedTimeline(){
  var rows = [];
  for (var i = 0; i < SCHED.length; i++) { rows.push({i: i, s: schedMin(SCHED[i].start), b: SCHED[i]}); }
  rows.sort(function(a, b){ return a.s - b.s; });
  var h = "<div class='tblwrap'><table><thead><tr><th>Block</th><th>Type</th><th>Time</th></tr></thead><tbody>";
  for (var j = 0; j < rows.length; j++) {
    var b = rows[j].b;
    if (b.kind !== "lesson") { continue; }
    h = h + "<tr><td><b>" + esc(b.name) + "</b></td><td class='muted'>lesson</td><td class='muted'>" + esc(b.start + "-" + b.end) + "</td></tr>";
  }
  for (var k = 0; k < rows.length; k++) {
    var b2 = rows[k].b;
    if (b2.kind === "lesson") { continue; }
    h = h + "<tr><td><b>" + esc(b2.name) + "</b></td><td class='muted'>" + esc(b2.kind) + "</td><td class='muted'>" + esc(b2.start + "-" + b2.end) + "</td></tr>";
  }
  return h + "</tbody></table></div>";
}

  h = h + "<div class='muted' style='font-size:12px;margin-top:8px'>A day that is not ticked is not part of the school week.</div></div>";

  h = h + "<label class='chk'><input type='checkbox' id='schAM'" + (sess.morning ? " checked" : "") + (rd ? " disabled" : "") + "><span>Morning session</span></label>";
  h = h + "<label class='chk'><input type='checkbox' id='schPM'" + (sess.afternoon ? " checked" : "") + (rd ? " disabled" : "") + "><span>Afternoon session</span></label>";
  h = h + "</div>";
  h = h + "<div class='card'><h2>Blocks of the day<span>lessons, breaks and lunch in order</span></h2>";
  h = h + "<div style='display:grid;grid-template-columns:1.2fr 1fr 0.9fr 0.9fr 38px;gap:6px'><span class='muted' style='font-size:11px'>NAME</span><span class='muted' style='font-size:11px'>TYPE</span><span class='muted' style='font-size:11px'>START</span><span class='muted' style='font-size:11px'>END</span><span></span></div>";
  h = h + "<div id='schBox'></div>";
  if (isWrite()) {
    h = h + "<div style='margin-top:12px;display:flex;gap:8px;flex-wrap:wrap'>";
    h = h + "<button class='sm' id='schAddLes'>+ Lesson</button>";
    h = h + "<button class='sm ghost' id='schAddBrk'>+ Break</button>";
    h = h + "<button class='sm ghost' id='schAddLun'>+ Lunch</button>";
    h = h + "</div>";
  }

  if (isWrite()) { h = h + "<button class='primary' id='schSave'>Save configuration</button>"; }
  $("main").innerHTML = h;
  scheddraw();
  var ds = $("main").querySelectorAll(".d-on");
  for (var e = 0; e < ds.length; e++) {
    ds[e].onchange = function(){
      collectSched();
      var day = this.getAttribute("data-day");
      var on = this.checked;
      var next = [];
      var choices = dayChoices();
      for (var f = 0; f < choices.length; f++) {
        var dd = choices[f];
        var isOn = SCHED_DAYS.indexOf(dd) >= 0;
        if (dd === day) { isOn = on; }
        if (isOn) { next.push(dd); }
      }
      SCHED_DAYS = next;
      schedView();
    };
  }
  var hs = $("main").querySelectorAll(".h-on");
  for (var g = 0; g < hs.length; g++) {
    hs[g].onchange = function(){

      var at = SCHED_HOL.indexOf(day);
      if (this.checked) {
        if (at < 0) { SCHED_HOL.push(day); }
      } else {
        if (at >= 0) { SCHED_HOL.splice(at, 1); }
      }
      schedView();

function schedAdd(kind){
  collectSched();
  if (SCHED.length >= 24) { toast("A day has 24 blocks at most.", "err"); return; }
  var lastEnd = schedMin(S.school ? (S.school.start_time || "08:00") : "08:00");
  for (var i = 0; i < SCHED.length; i++) {
    var e = schedMin(SCHED[i].end);
    if (e > lastEnd) { lastEnd = e; }
  }
  var len = 45;
  if (kind !== "lesson") { len = 20; }
  if (kind === "lunch") { len = 60; }
  var nm = "P" + (lessonIndexes().length + 1);
  if (kind === "break") { nm = "Break"; }
  if (kind === "lunch") { nm = "Lunch"; }
  SCHED.push({name: nm, kind: kind, start: schedHHMM(lastEnd), end: schedHHMM(lastEnd + len)});
  schedView();
}
function schedSave(){
  if (!isWrite()) { toast("Only an administrator can change this.", "err"); return; }
  collectSched();
  var name = $("schName").value.trim();
  if (name === "") { toast("Enter the school name.", "err"); return; }
  if (SCHED_DAYS.length === 0) { toast("Tick at least one working day.", "err"); return; }
  if (SCHED.length === 0) { toast("Add at least one period.", "err"); return; }
  var les = lessonIndexes();
  if (les.length === 0) { toast("A day needs at least one lesson period.", "err"); return; }
  var st = schedMin($("schStart").value);
  var en = schedMin($("schEnd").value);
  if (st < 0 || en < 0) { toast("Enter the school start and end times.", "err"); return; }
  if (en <= st) { toast("The school must end after it starts.", "err"); return; }
  var rows = [];
  for (var i = 0; i < SCHED.length; i++) {
    var b = SCHED[i];
    if (b.name === "") { toast("Block " + (i + 1) + " needs a name.", "err"); return; }
    var s = schedMin(b.start);
    var e = schedMin(b.end);
    if (s < 0 || e < 0) { toast(b.name + ": use times like 08:45.", "err"); return; }
    if (e <= s) { toast(b.name + " ends at or before it starts.", "err"); return; }
    if (s < st || e > en) { toast(b.name + " is outside the school day.", "err"); return; }
    rows.push({name: b.name, kind: b.kind, start: b.start, end: b.end, s: s, e: e});
  }
  rows.sort(function(a, b2){ return a.s - b2.s; });
  for (var j = 1; j < rows.length; j++) {
    if (rows[j].s < rows[j - 1].e) {
      toast("The times overlap: " + rows[j - 1].name + " and " + rows[j].name + ".", "err");
      return;
    }
  }
  var hol = [];
  for (var k = 0; k < SCHED_HOL.length; k++) { hol.push(SCHED_HOL[k]); }
  var school = {
    name: name,
    academic_year: $("schYear").value.trim(),
    days: SCHED_DAYS,
    periods: SCHED,
    start_time: $("schStart").value,
    end_time: $("schEnd").value,
    sessions: {morning: $("schAM").checked, afternoon: $("schPM").checked},
    holidays: hol,
    unavailable: SCHED_UN,
    logo_emoji: (S.school || {}).logo_emoji || ""
  };
  splash(true);
  api("settings.save", {school: school}).then(function(d){
    splash(false);
    S.school = d.school;
    SCHED_INIT = false;
    var cleared = d.cleared || 0;
    toast(cleared > 0 ? ("Saved. " + cleared + " lesson(s) no longer fit and were cleared.") : "Schedule saved", "ok");
    refresh().then(function(){ go("periods"); });
  }).catch(function(e){ splash(false); fail(e); });
}

var SCH_PAL = ["f6c9c4", "c9dcf6", "cdeacf", "f8dcb2", "e0d2f2", "c8e6e4",

function subjColor(sid){
  // The same subject keeps the same colour everywhere, taken from the school's
  // own colour when it has one.
  var idx = 0;
  for (var i = 0; i < (S.subjects || []).length; i++) {
    if (String(S.subjects[i].id) === String(sid)) {
      var own = String(S.subjects[i].color || "").replace("#", "").trim();
      if (own.length === 6) { return own; }
      idx = i;
    }
  }
  return SCH_PAL[idx % SCH_PAL.length];
}
function subjCode(sid){
  var s = tById(S.subjects || [], sid);
  if (!s) { return ""; }
  var c = String(s.code || "").trim();

  return String(s.name || "");

function tInitials(tid){
  var t = tById(S.teachers || [], tid);
  if (!t) { return ""; }
  var words = String(t.name || "").split(" ");
  var out = "";
  var n = 0;
  for (var i = 0; i < words.length; i++) {
    var w = words[i].trim();
    if (w === "") { continue; }
    if (n >= 2) { break; }
    out = out + w.charAt(0);
    n = n + 1;
  }

function schColumns(){

  // hidden by a filter.
  var out = [];
  for (var i = 0; i < (S.classes || []).length; i++) {
    var c = S.classes[i];
    var secs = [];
    for (var j = 0; j < (S.sections || []).length; j++) {
      if (String(S.sections[j].class_id) === String(c.id)) { secs.push(S.sections[j].id); }
    }

  }

}
function schMatch(l){

  var sec = parts[0];
  var d = parseInt(parts[1], 10);
  var p = parseInt(parts[2], 10);
  var table = (S.timetables || {})[sec] || {};
  var l = table[cellKey(d, p)] || {};
  var t = ttTime(p);
  var days = (S.school || {}).days || [];
  var h = "<div class='tblwrap'><table><tbody>";
  h = h + "<tr><td class='muted'>Subject</td><td><b>" + esc(nameOf(S.subjects, l.subject_id) || "-") + "</b></td></tr>";
  h = h + "<tr><td class='muted'>Teacher</td><td>" + esc(nameOf(S.teachers, l.teacher_id) || "not set") + "</td></tr>";
  h = h + "<tr><td class='muted'>Classroom</td><td>" + esc(nameOf(S.rooms, l.room_id) || "not set") + "</td></tr>";
  h = h + "<tr><td class='muted'>Day and period</td><td>" + esc((days[d] || "-") + " - " + t.n) + "</td></tr>";
  h = h + "<tr><td class='muted'>Time</td><td>" + esc(t.s + " - " + t.e) + "</td></tr>";
  h = h + "<tr><td class='muted'>Class</td><td>" + esc(sectionName(sec)) + "</td></tr>";
  h = h + "</tbody></table></div>";
  if (canWrite()) {
    h = h + "<div class='note'>Use Edit to change this lesson, or Move to put it in another period.</div>";
    h = h + "<div style='display:flex;gap:8px;flex-wrap:wrap;margin-top:8px'>";
    h = h + "<button class='sm primary' id='tvEdit'>Edit</button>";
    h = h + "<button class='sm' id='tvMove'>Move</button>";
    h = h + "<button class='sm bad' id='tvDel'>Clear this period</button>";
    h = h + "</div>";
    modal("Lesson", h, function(){ closeModal(); }, "Close");
    if ($("tvEdit")) { $("tvEdit").onclick = function(){ closeModal(); ttEditLesson(sec, d, p); }; }
    if ($("tvMove")) { $("tvMove").onclick = function(){ closeModal(); ttMoveLesson(sec, d, p); }; }
    if ($("tvDel")) { $("tvDel").onclick = function(){ closeModal(); ttClearLesson(sec, d, p); }; }
  } else {
    modal("Lesson", h, function(){ closeModal(); }, "Close");
  }
}
function ttFreeSlots(sec){
  // Teaching periods of one section that currently hold no lesson.
  var table = (S.timetables || {})[sec] || {};
  var days = (S.school || {}).days || [];
  var periods = (S.school || {}).periods || [];
  var hol = (S.school || {}).holidays || [];
  var blocked = (S.school || {}).unavailable || [];
  var out = [];
  for (var d = 0; d < days.length; d++) {
    if (hol.indexOf(String(days[d])) >= 0) { continue; }
    for (var p = 0; p < periods.length; p++) {
      var t = ttTime(p);
      if (t.k !== "lesson") { continue; }
      if (blocked.indexOf(String(d) + "-" + String(p)) >= 0) { continue; }
      if ((table[cellKey(d, p)] || {}).subject_id) { continue; }
      out.push({d: d, p: p, label: days[d] + " - " + t.n + " (" + t.s + "-" + t.e + ")"});
    }
  }
  return out;
}
function ttMoveLesson(sec, d, p){
  var free = ttFreeSlots(sec);
  if (free.length === 0) {
    modal("Move lesson", "<div class='warnbox'>Every other teaching period of this class already holds a lesson, so there is nowhere to move it.</div>", function(){ closeModal(); }, "Close");
    return;
  }
  var h = "<div class='muted' style='margin-bottom:10px'>" + esc(sectionName(sec)) + " - now " + esc(((S.school || {}).days || [])[d]) + " " + esc(ttTime(p).n) + "</div>";
  h = h + "<label class='f'><span>Move to this free period</span><select id='mvTo'>";
  for (var i = 0; i < free.length; i++) {
    h = h + "<option value='" + free[i].d + "-" + free[i].p + "'>" + esc(free[i].label) + "</option>";
  }
  h = h + "</select></label>";
  h = h + "<div class='note'>Only periods where this class is free are offered. Teacher and room clashes are checked before anything is saved.</div>";
  modal("Move lesson", h, function(done){
    var v = $("mvTo").value.split("-");
    var td = parseInt(v[0], 10);
    var tp = parseInt(v[1], 10);
    $("mOk").disabled = true;
    api("slot.move", {section_id: sec, from_day: d, from_period: p,
                      to_day: td, to_period: tp}).then(function(res){
      if (res.needs_confirm) {
        closeModal();
        ttConfirmMove(sec, d, p, td, tp, res.warnings || []);
        return;
      }
      closeModal();
      toast("Lesson moved", "ok");
      refresh().then(function(){ go("timetable"); });
    }).catch(function(e){ done(); fail(e); });
  }, "Move");
}
function ttConfirmMove(sec, d, p, td, tp, warnings){
  var h = "<div class='warnbox'><b>This move causes a conflict:</b>";
  for (var i = 0; i < warnings.length; i++) { h = h + "<div style='margin-top:4px'>" + esc(warnings[i]) + "</div>"; }
  h = h + "</div><div class='note'>Move it anyway? A clash would then appear on the Conflicts page.</div>";
  modal("Confirm the conflict", h, function(done){
    api("slot.move", {section_id: sec, from_day: d, from_period: p,
                      to_day: td, to_period: tp, force: true}).then(function(res){
      closeModal();
      toast("Lesson moved with a warning", "ok");
      refresh().then(function(){ go("timetable"); });
    }).catch(function(e){ done(); fail(e); });
  }, "Move anyway");
}
function ttEditLesson(sec, d, p){
  var table = (S.timetables || {})[sec] || {};
  var cur = table[cellKey(d, p)] || {};
  var h = "<div class='muted' style='margin-bottom:12px'>" + esc(sectionName(sec)) + " - " + esc(((S.school || {}).days || [])[d]) + " " + esc(ttTime(p).n) + " " + esc(ttTime(p).s + "-" + ttTime(p).e) + "</div>";
  h = h + "<label class='f'><span>Subject</span><select id='slSub'><option value=''>- free period -</option>" + optionsFor(S.subjects, cur.subject_id || "") + "</select></label>";
  h = h + "<label class='f'><span>Teacher</span><select id='slTch'><option value=''>- none -</option>" + optionsFor(S.teachers, cur.teacher_id || "") + "</select></label>";
  h = h + "<label class='f'><span>Classroom</span><select id='slRoom'><option value=''>- none -</option>" + optionsFor(S.rooms, cur.room_id || "") + "</select></label>";
  h = h + "<div id='slWarn'></div>";
  modal("Edit lesson", h, function(done){
    var sub = $("slSub").value;
    var tch = $("slTch").value;
    var rm = $("slRoom").value;
    var warns = ttLocalWarnings(sec, d, p, tch, rm);
    var apply = function(){
      api("slot.set", {section_id: sec, day: d, period: p, subject_id: sub,
                       teacher_id: tch, room_id: rm}).then(function(res){
        closeModal();
        if (sub === "") { toast("Period cleared", "ok"); }
        else { toast("Lesson saved", "ok"); }
        refresh().then(function(){ go("timetable"); });
      }).catch(function(e){ done(); fail(e); });
    };
    if (warns.length > 0) {
      closeModal();
      ttConfirmEdit(sec, d, p, sub, tch, rm, warns);
      return;
    }
    apply();
  }, "Save");
}
function ttLocalWarnings(sec, d, p, tch, rm){
  // Warnings the browser can work out before the server is asked.
  var warn = [];
  var k = cellKey(d, p);
  var days = (S.school || {}).days || [];
  for (var sid in (S.timetables || {})) {
    if (sid === sec) { continue; }
    var sl = ((S.timetables[sid] || {})[k] || {});
    if (!sl.subject_id) { continue; }
    if (tch !== "" && String(sl.teacher_id) === String(tch)) {
      warn.push(nameOf(S.teachers, tch) + " already teaches " + sectionName(sid) + " at this time.");
    }
    if (rm !== "" && String(sl.room_id) === String(rm)) {
      warn.push(nameOf(S.rooms, rm) + " is already used by " + sectionName(sid) + " at this time.");
    }
  }
  if (tch !== "") {
    var tr = tById(S.teachers, tch);
    var un = ((tr || {}).unavailable) || [];
    if (un.indexOf(k) >= 0) { warn.push(nameOf(S.teachers, tch) + " is marked unavailable at this time."); }
  }
  return warn;
}

function ttConfirmEdit(sec, d, p, sub, tch, rm, warns){
  var h = "<div class='warnbox'><b>Check before saving:</b>";
  for (var i = 0; i < warns.length; i++) { h = h + "<div style='margin-top:4px'>" + esc(warns[i]) + "</div>"; }
  h = h + "</div><div class='note'>Save anyway? The conflict will then be listed on the Conflicts page.</div>";
  modal("Confirm the conflict", h, function(done){
    api("slot.set", {section_id: sec, day: d, period: p, subject_id: sub,
                     teacher_id: tch, room_id: rm}).then(function(){
      closeModal();
      toast("Lesson saved with a warning", "ok");
      refresh().then(function(){ go("timetable"); });
    }).catch(function(e){ done(); fail(e); });
  }, "Save anyway");
}
function ttClearLesson(sec, d, p){
  modal("Clear this period", "<div class='errbox'>Remove the lesson from " + esc(sectionName(sec)) + " on " + esc(((S.school || {}).days || [])[d]) + " " + esc(ttTime(p).n) + "?</div>", function(done){
    api("slot.set", {section_id: sec, day: d, period: p, subject_id: "", teacher_id: "", room_id: ""}).then(function(){
      closeModal();
      toast("Period cleared", "ok");
      refresh().then(function(){ go("timetable"); });
    }).catch(function(e){ done(); fail(e); });
  }, "Clear");
}
document.addEventListener("DOMContentLoaded", function(){
  // Tell Telegram the page is ready and let it use the full height.
  var a = tgApp();
  if (a) {
    try {
      a.ready();
      a.expand();
      if (a.setHeaderColor) { a.setHeaderColor("#0f1420"); }
    } catch (e) {}
  }
  // The dashboard opens immediately: no login, no registration.
  boot();
  // Telegram may deliver initData a moment after the page loads.
  if (!readInitData()) {
    var tries = 0;
    var timer = setInterval(function(){
      tries = tries + 1;
      if (readInitData() !== "" || tries > 12) {
        clearInterval(timer);
        if (readInitData() !== "" && !S.me) { boot(); }
      }
    }, 400);
  }
});
</script>
