<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart School Timetable Generator</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg: #0f1420; --bg2: #161d2d; --card: #1b2434; --line: #2a3548;
--txt: #e8eefc; --mut: #93a1bb; --acc: #3d8bfd; --acc2: #1f6feb;
--ok: #2ecc8f; --warn: #f0a92b; --bad: #ff5c6c;}
*{box-sizing: border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin: 0; padding: 0; height: 100%;}
body{background: #0f1420; color: var(--txt); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.45; overflow-x: hidden;}
#app{display: flex; min-height: 100vh;}
#side{width: 234px; flex: 0 0 234px; background: var(--bg2); border-right: 1px solid var(--line); padding: 16px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto;}
.brand{display: flex; align-items: center; gap: 10px; padding: 6px 8px 16px 8px;}
.logo{width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, #3d8bfd, #7b5cff); display: flex; align-items: center; justify-content: center; font-size: 19px; flex: 0 0 38px;}
.brand b{display: block; font-size: 14px;}
.brand small{display: block; color: var(--mut); font-size: 11px;}
.navi{display: flex; flex-direction: column; gap: 3px;}
.navi a{display: flex; align-items: center; gap: 10px; padding: 10px 11px; border-radius: 10px; color: var(--mut); text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer;}
.navi a:hover{background: #202a3d; color: var(--txt);}
.navi a.on{background: linear-gradient(90deg, #22406e, #1d3054); color: #fff; box-shadow: inset 0 0 0 1px #2f5590;}
.navi a .badge{margin-left: auto; background: var(--bad); color: #fff; font-size: 11px; padding: 1px 7px; border-radius: 20px; font-weight: 700;}
#main{flex: 1; min-width: 0; padding: 18px 22px 90px 22px;}
.topline{display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px;}
.topline h1{font-size: 20px; margin: 0; font-weight: 650;}
.topline .sub{color: var(--mut); font-size: 13px;}
.spacer{flex: 1;}
.card{background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px;}
.card h2{font-size: 15px; margin: 0 0 12px 0; font-weight: 650;}
.card h2 span{color: var(--mut); font-weight: 400; font-size: 12px; margin-left: 6px;}
.kpis{display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; margin-bottom: 16px;}
.kpi{background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px;}
.kpi .v{font-size: 25px; font-weight: 700;}
.kpi .l{color: var(--mut); font-size: 12px; margin-top: 2px;}
.kpi.bad .v{color: var(--bad);} .kpi.ok .v{color: var(--ok);}
button{font-family: inherit; font-size: 14px; font-weight: 600; padding: 9px 15px; border-radius: 10px; border: 1px solid var(--line); background: #243149; color: var(--txt); cursor: pointer; display: inline-flex; align-items: center; gap: 7px;}
button:hover{background: #2c3b58;}
button.primary{background: linear-gradient(135deg, #3d8bfd, #2f6fe0); border-color: #3d8bfd; color: #fff;}
button.ghost{background: transparent;}
button.bad{background: #3a2028; border-color: #5c2b36; color: #ff8b96;}
button.sm{padding: 5px 10px; font-size: 12.5px; border-radius: 8px;}
button:disabled{opacity: .5; cursor: not-allowed;}
input,select,textarea{font-family: inherit; font-size: 14px; background: #131a29; color: var(--txt); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; outline: none;}
input:focus,select:focus,textarea:focus{border-color: var(--acc);}
label.f{display: block; margin-bottom: 11px;}
label.f>span{display: block; font-size: 12px; color: var(--mut); margin-bottom: 5px; font-weight: 600;}
.row{display: grid; grid-template-columns: 1fr 1fr; gap: 12px;}
.row3{display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;}
table{width: 100%; border-collapse: collapse; font-size: 13.5px;}
th{text-align: left; color: var(--mut); font-size: 11.5px; text-transform: uppercase; padding: 8px 10px; border-bottom: 1px solid var(--line); font-weight: 700;}
td{padding: 9px 10px; border-bottom: 1px solid #212b3d; vertical-align: middle;}
tr:last-child td{border-bottom: none;}
tbody tr:hover{background: #1f2839;}
.tblwrap{overflow-x: auto;}
.pill{display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 700; background: #243044; color: #9fb0cc;}
.pill.owner{background: #3a2f14; color: #f0c04b;}
.pill.admin{background: #16304f; color: #69a8ff;}
.pill.ok{background: #12362a; color: #4fe0a8;}
.pill.bad{background: #3a1f26; color: #ff8b96;}
.muted{color: var(--mut);}
.empty{color: var(--mut); text-align: center; padding: 26px 10px; font-size: 13.5px;}
#modal{position: fixed; inset: 0; background: rgba(6,9,16,.74); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 80;}
#modal.on{display: flex;}
.sheet{background: var(--card); border: 1px solid var(--line); border-radius: 16px; width: 100%; max-width: 540px; max-height: 88vh; overflow-y: auto; padding: 18px;}
.sheet h3{margin: 0 0 14px 0; font-size: 16px;}
.sheet .acts{display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap;}
#toast{position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(140%); background: #22303f; border: 1px solid var(--line); color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 13.5px; z-index: 120; max-width: 92vw;}
#toast.on{transform: translateX(-50%) translateY(0);}
#toast.err{background: #43202a; border-color: #6b2b38;}
#toast.ok{background: #14382c; border-color: #215f48;}
#login{min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 18px; display: none;}
#login .box{width: 100%; max-width: 400px;}
#login .logo{margin: 0 auto 14px auto;}
#login h1{text-align: center; font-size: 21px; margin: 0 0 4px 0;}
#login p.sub{text-align: center; color: var(--mut); font-size: 13px; margin: 0 0 20px 0;}
.tt{width: 100%; border-collapse: separate; border-spacing: 4px; font-size: 12.5px;}
.tt th{background: #212c40; border-radius: 8px; padding: 7px 4px; text-align: center; color: var(--mut); font-size: 11px; text-transform: none;}
.tt th.dh{text-align: left; padding-left: 9px; min-width: 74px;}
.tt td{padding: 0; border: none;}
.slot{min-height: 56px; border-radius: 9px; background: #141c2b; border: 1px dashed #2a3548; display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 5px 7px; cursor: pointer;}
.slot:hover{border-color: var(--acc); background: #182233;}
.slot.full{background: #1d2c47; border: 1px solid #2f5590;}
.slot b{font-size: 12px; font-weight: 650; line-height: 1.25;}
.slot small{font-size: 10.5px; color: var(--mut); line-height: 1.3;}
.slot .plus{color: #3f4f68; font-size: 16px; text-align: center;}
.legend{display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--mut); margin-top: 10px;}
.tabs{display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px;}
.tabs button{padding: 7px 13px; font-size: 13px; border-radius: 9px; background: #1c2637;}
.tabs button.on{background: var(--acc2); border-color: var(--acc); color: #fff;}
.chip{display: inline-flex; align-items: center; gap: 6px; background: #212c40; border: 1px solid var(--line); border-radius: 20px; padding: 4px 6px 4px 11px; font-size: 12.5px; margin: 0 6px 6px 0;}
.chip span.x{cursor: pointer; color: var(--mut); padding: 0 5px; font-weight: 700;}
.chip span.x:hover{color: var(--bad);}
.cur{border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; background: #151d2b;}
.curline{display: grid; grid-template-columns: 1.4fr 1.2fr .9fr 70px 34px; gap: 7px; margin-bottom: 7px; align-items: center;}
.curline select,.curline input{padding: 6px 8px; font-size: 12.5px;}
.note{background: #16233a; border-left: 3px solid var(--acc); padding: 10px 13px; border-radius: 8px; font-size: 12.5px; color: #b9c7de; margin-bottom: 14px;}
.warnbox{background: #3a2f14; border-left: 3px solid var(--warn); color: #f2cf8d; padding: 10px 13px; border-radius: 8px; font-size: 12.5px; margin-bottom: 12px;}
.errbox{background: #3a1f26; border-left: 3px solid var(--bad); color: #ffb3bb; padding: 10px 13px; border-radius: 8px; font-size: 12.5px; margin-bottom: 12px;}
.chk{display: flex; align-items: center; gap: 9px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 7px; background: #151d2b;}
.chk input{width: auto;}
.hero{background: linear-gradient(135deg, #1d2c47, #1b2434); border: 1px solid #2f5590; border-radius: 16px; padding: 18px; margin-bottom: 16px;}
.hero .hi{display: flex; align-items: center; gap: 14px; flex-wrap: wrap;}
.hero h1{font-size: 20px; margin: 0 0 3px 0; font-weight: 700;}
.hero .sub{color: #b9c7de; font-size: 13px;}
.logo{overflow: hidden;}
.logo img{width: 100%; height: 100%; object-fit: cover; border-radius: inherit;}
.logo.big{width: 56px; height: 56px; flex: 0 0 56px; border-radius: 15px; font-size: 26px;}
.steps{display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px;}
.step{display: flex; align-items: center; gap: 11px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: #151d2b; cursor: pointer;}
.step:hover{border-color: #2f5590;}
.step .sn{width: 26px; height: 26px; flex: 0 0 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: #243149; color: #9fb0cc;}
.step.done .sn{background: #14382c; color: #4fe0a8;}
.step b{display: block; font-size: 13.5px;}
.step small{display: block; color: var(--mut); font-size: 11.5px;}
.spinner{width: 26px; height: 26px; border: 3px solid #2a3548; border-top-color: var(--acc); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto;}
@keyframes spin{to{transform: rotate(360deg);}}
#splash{position: fixed; inset: 0; background: rgba(6,9,16,.72); z-index: 200; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; font-size: 13.5px; color: #dfe8f8;}
#splash.on{display: flex;}
#mnav{display: none;}
.statline{display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;}
@media(max-width: 880px){
#app{flex-direction: column;}
#side{width: 100%; flex: none; height: auto; position: sticky; top: 0; z-index: 50; border-right: none; border-bottom: 1px solid var(--line); padding: 8px 10px; background: var(--bg2);}
.brand{padding: 0;}
.brand small{display: none;}
.navi{display: none;}
#main{padding: 12px 12px 96px 12px;}
.hero{padding: 14px;}
.hero h1{font-size: 17px;}
.logo.big{width: 46px; height: 46px; flex: 0 0 46px; font-size: 22px; border-radius: 13px;}
#mnav{display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; background: #161d2d; border-top: 1px solid var(--line); padding: 5px 4px calc(5px + env(safe-area-inset-bottom)) 4px;}
#mnav .mb{flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; color: var(--mut); font-size: 10.5px; font-weight: 600; background: none; border: none; cursor: pointer;}
.navi a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.step:focus-visible,.kpi:focus-visible{outline: 2px solid var(--acc); outline-offset: 2px;}
.kpi[data-go2],.step[data-go3]{transition: border-color .15s, background .15s;}
#mnav .mb .mi{font-size: 17px; line-height: 1;}
#mnav .mb.on{color: #fff; background: #1d3054;}
#mnav .mb .dot{position: absolute; margin: -3px 0 0 16px; width: 7px; height: 7px; border-radius: 50%; background: var(--bad);}
.row,.row3{grid-template-columns: 1fr;}
.curline{grid-template-columns: 1fr 1fr; gap: 6px;}
.slot{min-height: 48px; padding: 4px 5px;}
.slot b{font-size: 11px;} .slot small{font-size: 9.5px;}
.tt th.dh{min-width: 52px; font-size: 10px;}
}
@media(max-width: 520px){
.kpis{grid-template-columns: 1fr 1fr; gap: 9px;}
.kpi .v{font-size: 21px;}
.kpi{padding: 11px;}
.card{padding: 13px;}
.topline h1{font-size: 18px;}
.hero .acts{width: 100%;}
}
</style>
</head>
<body>

<div id="blocked" style="display:none;min-height:100vh;align-items:center;justify-content:center;padding:18px">
  <div class="box" style="max-width:420px;text-align:center"></div>
</div>
<div id="app" style="display:none">
  <aside id="side">
    <div class="brand"><div class="logo">&#128197;</div><div><b id="brandName">My School</b><small id="brandUser">Telegram user</small></div></div>
    <nav class="navi" id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>
<nav id="mnav"></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="splash"><div class="spinner"></div><div>Working...</div></div>

<script>
var API = localStorage.getItem("tt_api") || "https://api.telebotcreator.com/new-webhook?data=gAAAAABq55aaWkppIq_n8zeXmiw7BiYF0TJQrqFBjr_eBH-eLs4VvBt3Kz3-yDyFNzCDddhRi6senACDb_qh6IoxmRrVhjLOco3Rhhcn70_UhtrTd8S26t-4YgJC7uz5HOgjHx1ibO_H58pYqur2anu5zH_xT5GgLfHg3q-y3be4VFGjZbY8F8qFa_LQ-Y4dhwxPHDVKPRjb";
// There is no username/password login. The Telegram account that opens this app
// is the identity: initData is signed by Telegram and checked on the server.
var INIT = "";
var S = {school: {name: "", days: [], periods: []}, teachers: [], subjects: [], rooms: [], classes: [], sections: [], curriculum: {}, timetables: {}, users: [], me: null, conflicts: []};
var VIEW = "dash";
function tgApp(){
  try {
    if (window.Telegram && window.Telegram.WebApp) { return window.Telegram.WebApp; }
  } catch (e) {}
  return null;
}
function readInitData(){
  var a = tgApp();
  if (a && a.initData) { return String(a.initData); }
  return "";
}
function tgUser(){
  var a = tgApp();
  try {
    if (a && a.initDataUnsafe && a.initDataUnsafe.user) { return a.initDataUnsafe.user; }
  } catch (e) {}
  return null;
}

function $(id){ return document.getElementById(id); }
function esc(v){
  if (v === null || v === undefined) { return ""; }
  return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function toast(m, kind){
  var t = $("toast");
  t.className = "on" + (kind ? " " + kind : "");
  t.textContent = m;
  setTimeout(function(){ t.className = ""; }, 3800);
}
function api(action, extra){
  var payload = {action: action, init_data: INIT};
  if (extra) { for (var k in extra) { payload[k] = extra[k]; } }
  // The webhook only parses application/json: a text/plain or form-encoded body is
// rejected with HTTP 400, which made every call in this app fail.
  return fetch(API, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload)})
    .then(function(r){ return r.text(); })
    .then(function(txt){
      var d = null;
      try { d = JSON.parse(txt); } catch (e) { d = null; }
      if (!d) { throw new Error("The API did not return JSON. Check the endpoint URL. " + txt.slice(0, 120)); }
      if (d.ok === false) { throw new Error(d.error || "Request failed"); }
      // The webhook always answers with {"ok": true, "result": { ... }}.
      // Without this unwrap every field (token, school, teachers, ...) reads as undefined.
      var inner = d;
      if (d.result !== null && typeof d.result === "object") { inner = d.result; }
      if (!inner || typeof inner !== "object") {
        throw new Error("The API sent an unexpected answer. Please try again.");
      }
      if (inner.ok === false) { throw new Error(inner.error || "Request failed"); }
      return inner;
    }).catch(function(e){
      if (e && (e.message === "Failed to fetch" || e.name === "TypeError")) {
        throw new Error("Could not reach the API. Usually the page and the API are on different hosts and the browser blocked the call (CORS). Check the endpoint under Advanced: API endpoint, or send /api to the bot for the right link.");
      }
      throw e;
    });
}
function tById(list, id){
  for (var i = 0; i < list.length; i++) { if (list[i].id === id) { return list[i]; } }
  return null;
}
function nameOf(list, id){ var r = tById(list, id); return r ? (r.name || r.code || "") : ""; }
function canWrite(){
  if (!S.me) { return false; }
  if (S.me.permissions) { return !!S.me.permissions.can_write; }
  return S.me.role === "super_admin" || S.me.role === "school_admin";
}
function isSuper(){
  if (!S.me) { return false; }
  if (S.me.permissions && S.me.permissions.is_super) { return true; }
  return S.me.role === "super_admin";
}
function isWrite(){ return canWrite(); }
function isOwner(){ return isSuper(); }
function roleLabel(){
  if (!S.me) { return ""; }
  return S.me.role_label || S.me.role || "";
}
function splash(on){
  var el = $("splash");
  if (!el) { return; }
  el.className = on ? "on" : "";
}
function logoSVG(size){
  var sc = (S.school || {});
  var em = sc.logo_emoji || "\uD83D\uDCC5";
  if (sc.logo_img) {
    return "<div class='logo" + (size === "big" ? " big" : "") + "'><img src='" + esc(sc.logo_img) + "' alt='School logo'></div>";
  }
  return "<div class='logo" + (size === "big" ? " big" : "") + "'>" + esc(em) + "</div>";
}
function greeting(){
  var hh = new Date().getHours();
  if (hh < 12) { return "Good morning"; }
  if (hh < 18) { return "Good afternoon"; }
  return "Good evening";
}
function refresh(){
  return api("state").then(function(d){
    applyState(d);
    return d;
  });
}
function fail(e){ toast(e.message || String(e), "err"); }

// There is no login screen. The dashboard opens immediately; the only thing that
// can stop it is Telegram not being present (the page was opened in a plain browser).
function blockScreen(title, msg, canRetry){
  $("app").style.display = "none";
  var box = $("blocked");
  if (!box) { return; }
  box.style.display = "flex";
  var h = "<div class='logo big'>&#128197;</div><h1>" + esc(title) + "</h1><p class='sub'>" + esc(msg) + "</p>";
  if (canRetry) { h = h + "<button class='primary' id='blkRetry'>Try again</button>"; }
  box.innerHTML = "<div class='box'>" + h + "</div>";
  if (canRetry && $("blkRetry")) { $("blkRetry").onclick = function(){ boot(); }; }
}
function unblock(){
  var box = $("blocked");
  if (box) { box.style.display = "none"; }
  $("app").style.display = "flex";
}
function boot(){
  INIT = readInitData();
  unblock();
  if (!API) {
    blockScreen("Almost ready", "The app has no API endpoint yet. Open it from the bot's button, or send /api to the bot.", true);
    return;
  }
  if (!INIT) {
    blockScreen("Open this app in Telegram",
      "This is a Telegram Mini App. Telegram provides your identity, so there is no password: open it from the button in the bot's chat.", true);
    return;
  }
  splash(true);
  api("state").then(function(d){
    splash(false);
    applyState(d);
    go("dash");
  }).catch(function(e){
    splash(false);
    blockScreen("Could not open the app", e.message || String(e), true);
  });
}
function applyState(d){
  S.school = d.school || S.school;
  S.teachers = d.teachers || [];
  S.subjects = d.subjects || [];
  S.rooms = d.rooms || [];
  S.classes = d.classes || [];
  S.sections = d.sections || [];
  S.curriculum = d.curriculum || {};
  S.timetables = d.timetables || {};
  S.users = d.users || [];
  S.me = d.me || null;
  S.conflicts = d.conflicts || [];
  S.notice = d.notice || "";
  var bn = $("brandName");
  if (bn && bn.parentNode && bn.parentNode.parentNode) {
    var brandBox = bn.parentNode.parentNode;
    var sig = String((S.school || {}).logo_img || "") + String((S.school || {}).logo_emoji || "");
    if (brandBox.getAttribute("data-logo") !== sig) {
      brandBox.setAttribute("data-logo", sig);
      var oldLogo = brandBox.querySelector(".logo");
      if (oldLogo) { oldLogo.outerHTML = logoSVG(""); }
    }
  }
  if (bn) { bn.textContent = S.school.name || "My School"; }
  var bu = $("brandUser");
  if (bu) { bu.textContent = (S.me ? (S.me.name + " - " + roleLabel()) : ""); }
}
function logout(){
  // No sign-out: your Telegram account is your identity. Closing the app is enough.
  toast("You stay signed in with your Telegram account.", "ok");
  go("dash");
}


var NAV = [
  {id: "dash", ic: "\u25A6", label: "Dashboard"},
  {id: "teachers", ic: "\u263A", label: "Teachers"},
  {id: "classes", ic: "\u25A4", label: "Classes"},
  {id: "subjects", ic: "\u2687", label: "Subjects"},
  {id: "rooms", ic: "\u25A3", label: "Classrooms"},
  {id: "periods", ic: "\u23F0", label: "Periods"},
  {id: "curriculum", ic: "\u270E", label: "Curriculum"},
  {id: "generate", ic: "\u2692", label: "Generate Timetable"},
  {id: "timetable", ic: "\u25A6", label: "View Timetable"},
  {id: "export", ic: "\u2913", label: "Export"},
  {id: "school", ic: "\u2691", label: "Settings"}
];
var MNAV = [
  {id: "dash", ic: "\u25A6", label: "Home"},

function badTime(v){
  if (v === "") { return false; }
  if (!/^[0-9]{1,2}:[0-9]{2}$/.test(v)) { return true; }
  var parts = v.split(":");
  var hh = parseInt(parts[0], 10);
  var mm = parseInt(parts[1], 10);
  return hh > 23 || mm > 59;
}

function doExport(fmt){
  var ids = [];
  var boxes = $("main").querySelectorAll("[data-exp]");
  for (var i = 0; i < boxes.length; i++) { if (boxes[i].checked) { ids.push(boxes[i].getAttribute("data-exp")); } }
  if (ids.length === 0) { toast("Choose at least one section.", "err"); return; }
  $("expOut").innerHTML = "<div class='muted'>Building the file...</div>";
  api("export." + fmt, {section_ids: ids}).then(function(d){
    var content = d.content || "";
    var mime = d.mime || "text/plain";
    if (d.encoding === "base64") {
      var bin = atob(content);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) { bytes[i] = bin.charCodeAt(i); }
      saveBlob(new Blob([bytes], {type: mime}), d.filename);
    } else {
      saveBlob(new Blob([content], {type: mime}), d.filename);
    }
    $("expOut").innerHTML = "<div class='note'>Saved " + esc(d.filename) + " (" + Math.round(content.length / 1024) + " KB). Check your downloads.</div>";
  }).catch(function(e){ $("expOut").innerHTML = ""; fail(e); });
}
function saveBlob(blob, filename){
  if (window.navigator && window.navigator.msSaveOrOpenBlob) {
    window.navigator.msSaveOrOpenBlob(blob, filename);
    return;
  }
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
  if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
    try { window.Telegram.WebApp.HapticFeedback.notificationOccurred("success"); } catch (e) {}
  }
}

function editTeacher(row){
  var title = row ? ("Edit " + (row.name || "teacher")) : "Add teacher";
  modal(title, teacherFormHtml(row), function(done){
    var data = readTeacherForm();
    if (data.code === "") { toast("Teacher ID is required.", "err"); done(); if ($("tCode")) { $("tCode").focus(); } return; }
    if (data.name === "") { toast("Full name is required.", "err"); done(); if ($("tName")) { $("tName").focus(); } return; }
    if (isNaN(data.max_per_day) || data.max_per_day < 0) { toast("Max periods per day must be 0 or more.", "err"); done(); return; }
    if (isNaN(data.max_per_week) || data.max_per_week < 0) { toast("Max periods per week must be 0 or more.", "err"); done(); return; }
    if (data.max_per_day > 0 && data.max_per_week > 0 && data.max_per_day > data.max_per_week) {
      toast("Per day (" + data.max_per_day + ") cannot be more than per week (" + data.max_per_week + ").", "err"); done(); return;
    }
    var clash = false;
    for (var i = 0; i < (S.teachers || []).length; i++) {
      var t = S.teachers[i];
      if (row && t.id === row.id) { continue; }
      if (String(t.code || "").toLowerCase() === data.code.toLowerCase()) { clash = true; }
    }
    if (clash) { toast("Teacher ID " + data.code + " is already used.", "err"); done(); return; }
    if (row) { data.id = row.id; }
    api(row ? "entity.update" : "entity.create", {entity: "teachers", data: data}).then(function(){
      closeModal();
      toast(row ? "Teacher updated" : "Teacher added", "ok");
      refresh().then(function(){ go("teachers"); });

      h = h + "<td class='muted'>" + esc(s.room_kind || "-") + "</td>";
      h = h + "<td class='muted'>" + esc(subjTeacherNames(s).join(", ") || "any") + "</td>";
      h = h + "<td class='muted'>" + subjLessons(s.id) + "</td>";
      h = h + "<td style='text-align:right;white-space:nowrap'>";
      h = h + "<button class='sm' data-sview='" + esc(s.id) + "'>View</button>";
      if (isWrite()) {
        h = h + " <button class='sm' data-sedit='" + esc(s.id) + "'>Edit</button>";
        h = h + " <button class='sm bad' data-sdel='" + esc(s.id) + "'>Delete</button>";
      }
      h = h + "</td></tr>";
    }
    h = h + "</tbody></table></div>";
  }
  h = h + "</div>";
  $("main").innerHTML = h;
  if ($("sAdd")) { $("sAdd").onclick = function(){ saveSubject(""); }; }
  if ($("sSeed")) { $("sSeed").onclick = seedSubjects; }
  if ($("sSearch")) {
    $("sSearch").oninput = function(){ SUBQ = this.value; subjectsPage(); if ($("sSearch")) { $("sSearch").focus(); } };
  }
  var vs = $("main").querySelectorAll("[data-sview]");
  for (var v = 0; v < vs.length; v++) {
    vs[v].onclick = function(){ viewSubject(this.getAttribute("data-sview")); };
  }
  var es = $("main").querySelectorAll("[data-sedit]");
  for (var e = 0; e < es.length; e++) {
    es[e].onclick = function(){ saveSubject(this.getAttribute("data-sedit")); };
  }
  var ds = $("main").querySelectorAll("[data-sdel]");
  for (var d = 0; d < ds.length; d++) {
    ds[d].onclick = function(){ delSubject(this.getAttribute("data-sdel")); };
  }
}
// ---------------- Classroom management ----------------
var ROOMQ = "";
function roomLessons(rid){
  var n = 0;
  for (var sid in S.timetables) {
    var t = S.timetables[sid] || {};
    for (var slot in t) { if (String((t[slot] || {}).room_id) === String(rid)) { n = n + 1; } }
  }
  return n;
}
function roomAssigned(rid){
  var n = 0;
  for (var i = 0; i < (S.classes || []).length; i++) { if (String(S.classes[i].room_id) === String(rid)) { n = n + 1; } }
  for (var j = 0; j < (S.sections || []).length; j++) { if (String(S.sections[j].room_id) === String(rid)) { n = n + 1; } }
  return n;
}
function roomSeatNeed(rid){
  var need = 0;
  for (var i = 0; i < (S.classes || []).length; i++) {
    var c = S.classes[i];
    if (String(c.room_id) === String(rid)) { need = Math.max(need, parseInt(c.students || 0, 10)); }
  }
  for (var j = 0; j < (S.sections || []).length; j++) {
    var s = S.sections[j];
    if (String(s.room_id) === String(rid)) { need = Math.max(need, parseInt(s.students || 0, 10)); }
  }
  return need;
}
function roomKindList(){
  var out = [];
  for (var i = 0; i < (S.rooms || []).length; i++) {
    var k = String(S.rooms[i].kind || "").trim();
    if (k !== "" && out.indexOf(k) < 0) { out.push(k); }
  }
  var usual = ["classroom", "laboratory", "computer room", "library", "gym", "workshop", "outdoor"];
  for (var j = 0; j < usual.length; j++) { if (out.indexOf(usual[j]) < 0) { out.push(usual[j]); } }
  return out;
}
function roomMatches(r, q){
  if (q === "") { return true; }
  var hay = (String(r.name || "") + " " + String(r.code || "") + " " + String(r.kind || "") +
             " " + (r.equipment || []).join(" ")).toLowerCase();
  return hay.indexOf(q) >= 0;
}
function roomUnavHtml(r){
  var un = (r || {}).unavailable || [];
  var days = ((S.school || {}).days) || [];
  var periods = ((S.school || {}).periods) || [];
  if (days.length === 0 || periods.length === 0) { return "<div class='muted'>Set the school week first.</div>"; }
  var h = "<div class='tblwrap'><table class='av'><thead><tr><th>Day</th>";
  for (var p = 0; p < periods.length; p++) { h = h + "<th style='text-align:center'>" + esc(periods[p].name || ("P" + (p + 1))) + "</th>"; }
  h = h + "</tr></thead><tbody>";
  for (var d = 0; d < days.length; d++) {
    h = h + "<tr><th style='text-align:left'>" + esc(days[d]) + "</th>";
    for (var q = 0; q < periods.length; q++) {
      var slot = d + "-" + q;
      var on = un.indexOf(slot) >= 0 ? " checked" : "";
      h = h + "<td style='text-align:center'><input type='checkbox' class='r-un' data-slot='" + slot + "'" + on + " style='width:auto'></td>";
    }
    h = h + "</tr>";
  }
  return h + "</tbody></table></div>";
}
function roomFormHtml(rid){
  var r = rid ? tById(S.rooms, rid) : null;
  var row = r || {};
  var h = "";
  h = h + "<div class='row'><label class='f'><span>Room ID *</span><input id='rCode' value='" + esc(row.code || "") + "' maxlength='20' placeholder='e.g. R101'></label>";
  h = h + "<label class='f'><span>Room name *</span><input id='rName' value='" + esc(row.name || "") + "' maxlength='60' placeholder='e.g. Room 101'></label></div>";
  h = h + "<div class='row'><label class='f'><span>Room type</span><select id='rKind'><option value=''>- not set -</option>";
  var kinds = roomKindList();
  for (var i = 0; i < kinds.length; i++) {
    h = h + "<option value='" + esc(kinds[i]) + "'" + (String(row.kind || "") === kinds[i] ? " selected" : "") + ">" + esc(kinds[i]) + "</option>";
  }
  h = h + "</select></label>";
  h = h + "<label class='f'><span>Maximum capacity (0 = no limit)</span><input id='rCap' type='number' min='0' max='2000' value='" + esc(row.capacity || 0) + "'></label></div>";
  var need = roomSeatNeed(rid || "");
  if (need > 0) {
    h = h + "<div class='note'>The largest class already seated here has " + need + " students.</div>";
  }
  h = h + "<label class='f'><span>Special equipment (separate with commas)</span><input id='rEq' value='" + esc((row.equipment || []).join(", ")) + "' placeholder='e.g. projector, fume hood, 30 computers'></label>";
  h = h + "<div class='f'><span style='display:block;font-size:12px;color:#93a1bb;margin:10px 0 5px;font-weight:600'>Availability - tick the times this room CANNOT be used</span>";
  h = h + roomUnavHtml(row);
  h = h + "<div class='muted' style='font-size:12px;margin-top:4px'>Leave every box clear when the room is always available.</div></div>";
  return h;
}
function readRoomForm(){
  var out = {"code": "", "name": "", "kind": "", "capacity": 0, "unavailable": [], "equipment": []};
  if ($("rCode")) { out.code = $("rCode").value.trim(); }
  if ($("rName")) { out.name = $("rName").value.trim(); }
  if ($("rKind")) { out.kind = $("rKind").value; }
  if ($("rCap")) { out.capacity = parseInt($("rCap").value || "0", 10); }
  if ($("rEq")) {
    var parts = $("rEq").value.split(",");
    for (var i = 0; i < parts.length; i++) {
      var e = parts[i].replace(/^\s+|\s+$/g, "");
      if (e !== "") { out.equipment.push(e); }
    }
  }
  var us = $("mBody").querySelectorAll(".r-un");
  for (var j = 0; j < us.length; j++) { if (us[j].checked) { out.unavailable.push(us[j].getAttribute("data-slot")); } }
  return out;
}
function saveRoom(rid){
  var row = rid ? tById(S.rooms, rid) : null;
  modal(row ? ("Edit " + (row.name || "room")) : "Add classroom", roomFormHtml(rid), function(done){
    var data = readRoomForm();
    if (data.code === "") { toast("Room ID is required.", "err"); done(); return; }
    if (data.name === "") { toast("Room name is required.", "err"); done(); return; }
    if (isNaN(data.capacity) || data.capacity < 0) { toast("Maximum capacity must be 0 or more.", "err"); done(); return; }
    var dup = false;
    for (var i = 0; i < (S.rooms || []).length; i++) {
      var r = S.rooms[i];
      if (row && r.id === row.id) { continue; }
      if (String(r.code || "").toLowerCase() === data.code.toLowerCase()) { dup = true; }
    }
    if (dup) { toast("Room ID " + data.code + " is already used.", "err"); done(); return; }
    if (data.capacity > 0 && row) {
      var need = roomSeatNeed(row.id);
      if (need > data.capacity) { toast("A class of " + need + " is seated here. Capacity cannot be lower.", "err"); done(); return; }
    }
    if (row) { data.id = row.id; }
    api("room.save", {data: data}).then(function(){
      closeModal();
      toast(row ? "Classroom saved" : "Classroom added", "ok");
      refresh().then(function(){ go("rooms"); });
    }).catch(function(e){ done(); fail(e); });
  }, "Save");
}
function viewRoom(rid){
  var r = tById(S.rooms, rid);
  if (!r) { return; }
  var days = ((S.school || {}).days) || [];
  var periods = ((S.school || {}).periods) || [];
  var un = r.unavailable || [];
  var unText = [];
  for (var i = 0; i < un.length; i++) {
    var pp = String(un[i]).split("-");
    var dn = days[parseInt(pp[0], 10)] || "?";
    var pn = (periods[parseInt(pp[1], 10)] || {}).name || "?";
    unText.push(dn + " " + pn);
  }
  var h = "<div class='tblwrap'><table><tbody>";
  h = h + "<tr><td class='muted'>Room ID</td><td><b>" + esc(r.code || "-") + "</b></td></tr>";
  h = h + "<tr><td class='muted'>Name</td><td>" + esc(r.name) + "</td></tr>";
  h = h + "<tr><td class='muted'>Type</td><td>" + esc(r.kind || "-") + "</td></tr>";
  h = h + "<tr><td class='muted'>Maximum capacity</td><td>" + esc(r.capacity > 0 ? r.capacity : "no limit") + "</td></tr>";
  h = h + "<tr><td class='muted'>Equipment</td><td>" + esc((r.equipment || []).join(", ") || "-") + "</td></tr>";
  h = h + "<tr><td class='muted'>Not available</td><td>" + esc(unText.join(", ") || "always available") + "</td></tr>";
  h = h + "<tr><td class='muted'>Assigned to</td><td>" + roomAssigned(r.id) + " class(es)</td></tr>";
  h = h + "<tr><td class='muted'>On the timetable</td><td>" + roomLessons(r.id) + " lesson(s)</td></tr>";
  h = h + "</tbody></table></div>";
  modal("Room " + (r.code || r.name), h, function(){ closeModal(); }, "Close");
}
function delRoom(rid){
  var r = tById(S.rooms, rid);
  if (!r) { return; }
  var lessons = roomLessons(r.id);
  var assigned = roomAssigned(r.id);
  var body = "<div class='errbox'>Delete " + esc(r.name) + " (ID " + esc(r.code || "") + ")?</div>";
  if (lessons > 0 || assigned > 0) {
    body = body + "<div class='warnbox'><b>This room is still in use.</b> ";
    if (lessons > 0) { body = body + lessons + " scheduled lesson(s) use it. "; }
    if (assigned > 0) { body = body + "It is the assigned classroom of " + assigned + " class(es). "; }
    body = body + "Deleting it clears the room from those lessons.</div>";
  } else {
    body = body + "<div class='note'>Nothing uses this room yet.</div>";
  }
  modal(lessons > 0 ? "Delete a room that is in use" : "Delete classroom", body, function(done){
    var extra = {entity: "rooms", id: r.id};
    if (lessons > 0 || assigned > 0) { extra.force = true; }
    api("entity.delete", extra).then(function(){
      closeModal();
      toast("Classroom deleted", "ok");
      refresh().then(function(){ go("rooms"); });
    }).catch(function(e){ done(); fail(e); });
  }, "Delete");
}
function seedRooms(){
  modal("Add the standard rooms",
    "<div class='note'>This adds Room 101, Room 102, Biology Laboratory, Chemistry Laboratory, Computer Laboratory, Library and Physical Education Area. Rooms that already exist by the same ID are left alone, and all of them stay editable.</div>",
    function(done){
      api("rooms.seed", {}).then(function(d){
        closeModal();
        toast("Added " + ((d.made || []).length) + " room(s)", "ok");
        refresh().then(function(){ go("rooms"); });
      }).catch(function(e){ done(); fail(e); });
    }, "Add them");
}
function roomsPage(){
  var rows = S.rooms || [];
  var q = String(ROOMQ || "").toLowerCase();
  var shown = [];
  for (var i = 0; i < rows.length; i++) { if (roomMatches(rows[i], q)) { shown.push(rows[i]); } }
  var right = "";
  if (isWrite()) {
    right = "<button class='sm ghost' id='rSeed'>Standard rooms</button> <button class='primary' id='rAdd'>+ Add classroom</button>";
  }
  var h = head("Classrooms", rows.length + " room(s)");
  h = h + "<div class='card'><div class='row'><label class='f'><span>Search classrooms</span><input id='rSearch' value='" + esc(ROOMQ) + "' placeholder='Room ID, name, type or equipment'></label>";
  h = h + "<div class='f'><span>&nbsp;</span>" + right + "</div></div>";
  h = h + "<div class='muted' style='font-size:12.5px'>Showing " + shown.length + " of " + rows.length + "</div></div>";
  h = h + "<div class='card'>";
  if (rows.length === 0) {
    h = h + "<div class='empty'>No classrooms yet. " + (isWrite() ? "Use Add classroom, or Standard rooms to create the seven usual ones." : "") + "</div>";
  } else if (shown.length === 0) {
    h = h + "<div class='empty'>No classroom matches that search.</div>";
  } else {
    h = h + "<div class='tblwrap'><table><thead><tr><th>Room ID</th><th>Name</th><th>Type</th><th>Capacity</th><th>Availability</th><th>Equipment</th><th>Assigned</th><th>Lessons</th><th></th></tr></thead><tbody>";
    for (var j = 0; j < shown.length; j++) {
      var r = shown[j];
      var un = (r.unavailable || []).length;
      h = h + "<tr><td class='muted'>" + esc(r.code || "-") + "</td>";
      h = h + "<td><b>" + esc(r.name) + "</b></td>";
      h = h + "<td class='muted'>" + esc(r.kind || "-") + "</td>";
      h = h + "<td class='muted'>" + esc(r.capacity > 0 ? r.capacity : "-") + "</td>";
      h = h + "<td class='muted'>" + esc(un === 0 ? "always" : (un + " blocked")) + "</td>";
      h = h + "<td class='muted'>" + esc((r.equipment || []).join(", ") || "-") + "</td>";
      h = h + "<td class='muted'>" + roomAssigned(r.id) + "</td>";
      h = h + "<td class='muted'>" + roomLessons(r.id) + "</td>";
      h = h + "<td style='text-align:right;white-space:nowrap'>";
      h = h + "<button class='sm' data-rview='" + esc(r.id) + "'>View</button>";
      if (isWrite()) {
        h = h + " <button class='sm' data-redit='" + esc(r.id) + "'>Edit</button>";
        h = h + " <button class='sm bad' data-rdel='" + esc(r.id) + "'>Delete</button>";
      }
      h = h + "</td></tr>";
    }
    h = h + "</tbody></table></div>";
  }
  h = h + "</div>";
  $("main").innerHTML = h;
  if ($("rAdd")) { $("rAdd").onclick = function(){ saveRoom(""); }; }
  if ($("rSeed")) { $("rSeed").onclick = seedRooms; }
  if ($("rSearch")) {
    $("rSearch").oninput = function(){ ROOMQ = this.value; roomsPage(); if ($("rSearch")) { $("rSearch").focus(); } };
  }
  var vs = $("main").querySelectorAll("[data-rview]");
  for (var v = 0; v < vs.length; v++) {
    vs[v].onclick = function(){ viewRoom(this.getAttribute("data-rview")); };
  }
  var es = $("main").querySelectorAll("[data-redit]");
  for (var e = 0; e < es.length; e++) {
    es[e].onclick = function(){ saveRoom(this.getAttribute("data-redit")); };
  }
  var ds = $("main").querySelectorAll("[data-rdel]");
  for (var d = 0; d < ds.length; d++) {
    ds[d].onclick = function(){ delRoom(this.getAttribute("data-rdel")); };
  }
}
document.addEventListener("DOMContentLoaded", function(){
  // Tell Telegram the page is ready and let it use the full height.
  var a = tgApp();
  if (a) {
    try {
      a.ready();
      a.expand();
      if (a.setHeaderColor) { a.setHeaderColor("#0f1420"); }
    } catch (e) {}
  }
  // The dashboard opens immediately: no login, no registration.
  boot();
  // Telegram may deliver initData a moment after the page loads.
  if (!readInitData()) {
    var tries = 0;
    var timer = setInterval(function(){
      tries = tries + 1;
      if (readInitData() !== "" || tries > 12) {
        clearInterval(timer);
        if (readInitData() !== "" && !S.me) { boot(); }
      }
    }, 400);
  }
});
